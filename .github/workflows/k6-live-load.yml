name: k6 Live Load (staging)

# Load-tests the public live-viewer path (Socket.IO /live over long-polling + public REST) of staging only.
# Large peaks are split across runner shards (SHARD_SIZE viewers each) that start at the same instant.
# A guard job probes PRODUCTION (same VPS as staging) and cancels the whole run if it degrades.
# Needs environment `staging` (secret STAGING_BASIC_AUTH), so it only runs from main.
on:
  workflow_dispatch:
    inputs:
      peak_viewers:
        description: Total peak concurrent viewers (split over shards of 2500)
        type: choice
        options: ['100', '1000', '5000', '10000', '20000']
        default: '100'
      hold_seconds:
        description: Seconds to hold the peak
        type: string
        default: '60'
      match_id:
        description: Match UUID to watch (empty = auto-pick a public match)
        type: string
        default: ''
      script:
        description: 'live-viewers.js = only live viewers; web-mixed.js = live viewers + people opening public web pages'
        type: choice
        options: ['live-viewers.js', 'web-mixed.js']
        default: 'live-viewers.js'
      page_peak:
        description: 'web-mixed.js only: peak concurrent people browsing pages (per shard)'
        type: string
        default: '0'
      rest_abort:
        description: 'on = abort the run when REST p95 > 1s (default); off = keep going to find the real breaking point (join failures still abort)'
        type: choice
        options: ['on', 'off']
        default: 'on'

permissions:
  contents: read

concurrency:
  group: k6-live-load
  cancel-in-progress: false

env:
  TARGET_HOST: staging.sporto.asia
  PROD_HOST: sporto.asia
  K6_VERSION: 0.57.0
  SHARD_SIZE: '2500'
  RAMP_SECONDS: '45'
  HOLD_SECONDS: ${{ inputs.hold_seconds }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      per_shard: ${{ steps.plan.outputs.per_shard }}
      start_epoch: ${{ steps.plan.outputs.start_epoch }}
      duration_s: ${{ steps.plan.outputs.duration_s }}
      match_id: ${{ steps.match.outputs.id }}
      tournament_id: ${{ steps.match.outputs.tid }}
    steps:
      - name: Mask derived credential
        env:
          BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          if [[ -z "$BASIC_AUTH" ]]; then
            echo "::error::Thiếu secret STAGING_BASIC_AUTH của environment staging."
            exit 1
          fi
          # The base64 form is not masked by GitHub automatically.
          echo "::add-mask::$(printf %s "$BASIC_AUTH" | base64 -w0)"

      - name: Plan shards and common start time
        id: plan
        env:
          PEAK_TOTAL: ${{ inputs.peak_viewers }}
        run: |
          set -euo pipefail
          [[ "$HOLD_SECONDS" =~ ^[0-9]+$ ]] || { echo "::error::hold_seconds phải là số."; exit 1; }
          shards=$(( (PEAK_TOTAL + SHARD_SIZE - 1) / SHARD_SIZE ))
          per_shard=$(( (PEAK_TOTAL + shards - 1) / shards ))
          # Leave time for k6 + (shard 0) Playwright installs before everyone starts together.
          start_epoch=$(( $(date +%s) + 240 ))
          duration_s=$(( 3 * RAMP_SECONDS + HOLD_SECONDS + 10 ))
          list="$(seq -s, 0 $(( shards - 1 )))"
          echo "shards=[${list}]" >> "$GITHUB_OUTPUT"
          echo "per_shard=$per_shard" >> "$GITHUB_OUTPUT"
          echo "start_epoch=$start_epoch" >> "$GITHUB_OUTPUT"
          echo "duration_s=$duration_s" >> "$GITHUB_OUTPUT"
          echo "Total $PEAK_TOTAL viewers = $shards shard(s) x $per_shard"

      - name: Pick a public match
        id: match
        env:
          BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
          INPUT_MATCH_ID: ${{ inputs.match_id }}
        run: |
          set -euo pipefail
          pick() {
            curl -fsS --max-time 20 -u "$BASIC_AUTH" "https://$TARGET_HOST/api/v1/matches?$1" \
              | jq -r '[.. | objects | select(has("id") and has("status")) | .id][0] // empty'
          }
          MATCH_ID="$INPUT_MATCH_ID"
          [[ -n "$MATCH_ID" ]] || MATCH_ID="$(pick 'status=IN_PROGRESS&limit=5' || true)"
          [[ -n "$MATCH_ID" ]] || MATCH_ID="$(pick 'limit=5' || true)"
          if [[ -z "$MATCH_ID" ]]; then
            echo "::error::Không tìm thấy trận công khai nào trên staging."
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -u "$BASIC_AUTH" "https://$TARGET_HOST/api/v1/matches/$MATCH_ID")"
          if [[ "$code" != "200" ]]; then
            echo "::error::GET /matches/$MATCH_ID trả $code (mong đợi 200)."
            exit 1
          fi
          echo "Trận dùng để test: $MATCH_ID"
          echo "id=$MATCH_ID" >> "$GITHUB_OUTPUT"
          TID="$(curl -fsS --max-time 20 -u "$BASIC_AUTH" "https://$TARGET_HOST/api/v1/matches/$MATCH_ID" \
            | jq -r '[.. | objects | select(has("tournamentId")) | .tournamentId | strings][0] // empty' || true)"
          echo "tid=$TID" >> "$GITHUB_OUTPUT"

      - name: Check public pages answer 200 (web-mixed.js only)
        if: ${{ inputs.script == 'web-mixed.js' }}
        env:
          BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
          MATCH_ID: ${{ steps.match.outputs.id }}
          TID: ${{ steps.match.outputs.tid }}
          PAGE_PEAK: ${{ inputs.page_peak }}
        run: |
          set -uo pipefail
          [[ "$PAGE_PEAK" =~ ^[0-9]+$ ]] || { echo "::error::page_peak phải là số."; exit 1; }
          paths=(/ /tournaments /matches "/live/$MATCH_ID")
          [[ -n "$TID" ]] && paths+=("/tournaments/$TID")
          bad=0
          for p in "${paths[@]}"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -u "$BASIC_AUTH" "https://$TARGET_HOST$p")"
            echo "$p -> $code"
            [[ "$code" == "200" ]] || bad=1
          done
          (( bad == 0 )) || { echo "::error::Có trang không trả 200 trên staging."; exit 1; }

  # Kill switch: staging shares the VPS with production, so watch production while the load runs.
  guard:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    env:
      START_EPOCH: ${{ needs.plan.outputs.start_epoch }}
      DURATION_S: ${{ needs.plan.outputs.duration_s }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe production until the test ends
        run: |
          set -uo pipefail
          END=$(( START_EPOCH + DURATION_S + 90 ))
          bad=0
          mkdir -p guard
          echo "epoch,api_http,api_s,web_http,web_s" > guard/prod-probe.csv
          probe() { curl -s -o /dev/null -w '%{http_code},%{time_total}' --max-time 8 "$1" || echo "000,8"; }
          while (( $(date +%s) < END )); do
            api="$(probe "https://$PROD_HOST/api/v1/categories")"
            web="$(probe "https://$PROD_HOST/")"
            echo "$(date +%s),$api,$web" >> guard/prod-probe.csv
            slow=0
            for r in "$api" "$web"; do
              code="${r%%,*}"; t="${r##*,}"
              if [[ "$code" != "200" ]] || awk -v t="$t" 'BEGIN{exit !(t>3)}'; then slow=1; fi
            done
            if (( slow )); then bad=$(( bad + 1 )); else bad=0; fi
            if (( bad >= 3 )); then
              echo "::error::Production suy giảm 3 lần liên tiếp (lỗi hoặc >3s). Huỷ run để bảo vệ production."
              echo "tripped at $(date -u +%FT%TZ)" > guard/TRIPPED.txt
              gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
              break
            fi
            sleep 3
          done
      - name: Upload production probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-prod-probe
          path: guard/
          retention-days: 7
          if-no-files-found: warn

  load:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      PEAK: ${{ needs.plan.outputs.per_shard }}
      MATCH_ID: ${{ needs.plan.outputs.match_id }}
      TOURNAMENT_ID: ${{ needs.plan.outputs.tournament_id }}
      PAGE_PEAK: ${{ inputs.page_peak }}
      K6_SCRIPT: ${{ inputs.script }}
      START_EPOCH: ${{ needs.plan.outputs.start_epoch }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask derived credential
        env:
          BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: echo "::add-mask::$(printf %s "$BASIC_AUTH" | base64 -w0)"

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo install "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Install Playwright (shard 0 records evidence)
        if: matrix.shard == 0
        working-directory: scripts/loadtest
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run k6 (+ browser recording on shard 0)
        env:
          BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
          K6_WEB_DASHBOARD: ${{ matrix.shard == 0 && 'true' || 'false' }}
          K6_WEB_DASHBOARD_EXPORT: report.html
          REST_ABORT: ${{ inputs.rest_abort }}
        run: |
          # GitHub starts bash with -e; k6 exits non-zero on a crossed threshold and we must still wait for the browser.
          set +e
          set -uo pipefail
          mkdir -p evidence
          ulimit -n 1048576 2>/dev/null || ulimit -n "$(ulimit -Hn)"
          now=$(date +%s)
          if (( now > START_EPOCH )); then echo "::warning::Shard $SHARD tới trễ $(( now - START_EPOCH ))s so với giờ bắt đầu chung."; fi
          while (( $(date +%s) < START_EPOCH )); do sleep 1; done

          WATCH_PID=""
          DASH_PID=""
          if [[ "$SHARD" == "0" ]]; then
            WATCH_SECONDS=$(( 3 * RAMP_SECONDS + HOLD_SECONDS + 20 ))
            ( cd scripts/loadtest && node evidence.mjs watch "$TARGET_HOST" "$MATCH_ID" ../../evidence/browser "$WATCH_SECONDS" ) \
              > evidence/browser-run.log 2>&1 &
            WATCH_PID=$!
            ( cd scripts/loadtest && node evidence.mjs dash ../../evidence/dashboard "$WATCH_SECONDS" ) \
              > evidence/dash-run.log 2>&1 &
            DASH_PID=$!
          fi
          # Runner CPU every 3s (us/sy/id): tells whether the load generator itself is the bottleneck.
          vmstat -n 3 > evidence/runner-vmstat.log 2>&1 &
          VMSTAT_PID=$!
          k6 run --summary-export evidence/summary.json "scripts/loadtest/$K6_SCRIPT" 2>&1 | tee evidence/k6.log
          K6_EXIT=${PIPESTATUS[0]}
          kill "$VMSTAT_PID" 2>/dev/null
          [[ -n "$WATCH_PID" ]] && { wait "$WATCH_PID" || echo "browser recorder exited non-zero (see browser-run.log)"; }
          [[ -n "$DASH_PID" ]] && { wait "$DASH_PID" || echo "dashboard recorder exited non-zero (see dash-run.log)"; }
          [[ -f report.html ]] && mv report.html evidence/report.html
          echo "$K6_EXIT" > evidence/k6-exit-code.txt
          echo "K6_EXIT=$K6_EXIT" >> "$GITHUB_ENV"

      - name: Screenshot k6 dashboard (shard 0)
        if: always() && matrix.shard == 0
        working-directory: scripts/loadtest
        run: |
          [[ -f ../../evidence/report.html ]] || { echo "no report.html"; exit 0; }
          node evidence.mjs report ../../evidence/report.html ../../evidence/k6-dashboard.png || true

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-shard-${{ matrix.shard }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail when k6 thresholds failed
        if: always() && env.K6_EXIT != '' && env.K6_EXIT != '0'
        run: |
          echo "::error::k6 shard $SHARD exit code $K6_EXIT (threshold crossed or run aborted)."
          exit 1

  report:
    needs: [plan, load, guard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: k6-*
          path: all
      - name: Merge shard results
        env:
          PEAK_TOTAL: ${{ inputs.peak_viewers }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          PER_SHARD: ${{ needs.plan.outputs.per_shard }}
        run: |
          set -uo pipefail
          {
            echo "### k6 live load (staging, long-polling) - total ${PEAK_TOTAL} viewers = ${SHARDS} shard(s) x ${PER_SHARD}, hold ${HOLD_SECONDS}s"
            if [[ -f all/k6-prod-probe/TRIPPED.txt ]]; then
              echo "**KILL SWITCH FIRED**: production degraded, run cancelled ($(cat all/k6-prod-probe/TRIPPED.txt))."
            fi
            codes="$(cat all/k6-shard-*/k6-exit-code.txt 2>/dev/null | tr '\n' ' ')"
            echo "k6 exit codes per shard: \`${codes:-none}\` (0 = thresholds passed)"
            if ls all/k6-shard-*/summary.json >/dev/null 2>&1; then
              echo ""
              echo "| Metric | Value |"
              echo "|---|---|"
              jq -s -r '
                def sum(f): map(f // 0) | add;
                def mx(f): map(f // 0) | max;
                sum(.metrics.live_join_ok.passes) as $ok | sum(.metrics.live_join_ok.fails) as $bad |
                "| Shards reporting | \(length) |",
                "| Joins ok / failed | \($ok) / \($bad) |",
                "| Max viewer count seen by server | \(mx(.metrics.live_viewer_count_seen.max)) |",
                "| Max server connections | \(mx(.metrics.live_server_connections.max)) |",
                "| Join p95, worst shard (ms) | \(mx(.metrics.live_join_ms["p(95)"])) |",
                "| REST p95, worst shard (ms) | \(mx(.metrics["http_req_duration{scenario:readers}"]["p(95)"])) |",
                "| Server event-loop lag p95, worst (ms) | \(mx(.metrics.live_server_event_loop_lag_ms["p(95)"])) |",
                "| Failed HTTP requests / total | \(sum(.metrics.http_req_failed.passes)) / \(sum(.metrics.http_req_failed.passes) + sum(.metrics.http_req_failed.fails)) |",
                "| WS/protocol errors | \(sum(.metrics.live_ws_errors.count)) |"
              ' all/k6-shard-*/summary.json
              if grep -q 'name:page_home' all/k6-shard-*/summary.json 2>/dev/null; then
                jq -s -r '
                  def mx(f): map(f // 0) | max;
                  def rows($n): "| Page p95 \($n), worst shard (ms) | \(mx(.metrics["http_req_duration{name:page_\($n)}"]["p(95)"])) |";
                  rows("home"), rows("tournaments"), rows("matches"), rows("tournament_detail"), rows("live"),
                  "| Failed page requests (rate, worst shard) | \(mx(.metrics["http_req_failed{scenario:pages}"].value)) |"
                ' all/k6-shard-*/summary.json
              fi
            fi
            if [[ -f all/k6-prod-probe/prod-probe.csv ]]; then
              echo ""
              echo "Production probe (every ~3s):"
              awk -F, 'NR>1 { n++; if ($2!="200"||$4!="200") err++; if ($3>mx) mx=$3; if ($5>mw) mw=$5 }
                END { printf "- samples: %d, non-200: %d, worst api %.2fs, worst web %.2fs\n", n, err+0, mx, mw }' all/k6-prod-probe/prod-probe.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
