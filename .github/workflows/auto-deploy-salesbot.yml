name: Auto deploy salesbot main

# Cu ~10 phut so SHA moi nhat cua main salesbot-admin (bot Zalo) voi cac lan deploy-salesbot.yml da chay; SHA chua
# deploy thi goi deploy-salesbot.yml cho dung SHA do (build image, len VPS, loi thi tu quay ve ban truoc).
# Cong tac: bien repo SALESBOT_AUTO_DEPLOY=on moi chay; khac "on" thi job bi bo qua (mac dinh TAT).
#   gh variable set SALESBOT_AUTO_DEPLOY -R babydanh/agent-orchestrator -b on    # bat
#   gh variable set SALESBOT_AUTO_DEPLOY -R babydanh/agent-orchestrator -b off   # tat
# Truoc khi bat: (1) environment `salesbot` co du secret VPS_*, APP_DIR; (2) lan deploy dau chay tay voi input origin;
# (3) main salesbot-admin da chua ban dang chay that, neu khong ban cu tren main se de len ban moi hon.
# Cron cua GitHub co the tre/bo luot; deploy cham vai chuc phut la chap nhan duoc cho bot nen khong tu lap nhu Web.
# Chay thu khong deploy: gh workflow run auto-deploy-salesbot.yml -R babydanh/agent-orchestrator -f dry_run=true
run-name: "auto-deploy salesbot main${{ inputs.dry_run && ' (dry-run)' || '' }}"

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chi in quyet dinh, khong goi deploy'
        type: boolean
        default: false

concurrency:
  group: auto-deploy-salesbot-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watch:
    name: So main salesbot-admin voi lan deploy cuoi
    if: ${{ vars.SALESBOT_AUTO_DEPLOY == 'on' || inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quet main, goi deploy-salesbot neu co SHA moi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DISPATCH_TOKEN: ${{ github.token }}
          SRC: ${{ github.repository_owner }}/salesbot-admin
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$SRC/commits/main" --jq .sha)"
          committed="$(gh api "repos/$SRC/commits/$sha" --jq .commit.committer.date)"
          # Cho 3 phut sau commit de mot loat push lien tiep chi deploy ban cuoi.
          age=$(( $(date +%s) - $(date -d "$committed" +%s) ))
          if (( age < 180 )); then
            echo "SKIP  $sha moi $age giay tuoi, cho luot sau."
            exit 0
          fi
          # Lan deploy da goi cho SHA nay (dang chay, xong hay loi deu tinh; loi thi khong goi lai), tru lan bi huy/dry-run.
          # Lay danh sach vao bien truoc: grep -q thoat som lam gh dinh SIGPIPE, pipefail se hieu nham la "chua deploy".
          runs="$(gh run list -R "$REPO" --workflow deploy-salesbot.yml -L 100 --json displayTitle,conclusion --jq \
            '.[] | select(.conclusion != "cancelled") | .displayTitle')"
          if grep -qFx "deploy salesbot @$sha" <<<"$runs"; then
            echo "OK    $sha da deploy."
            exit 0
          fi
          # Commit chua co bo Docker thi deploy-salesbot chac chan hong; bo qua thay vi build 3 image vo ich.
          if ! gh api "repos/$SRC/contents/deploy/docker/compose.yaml?ref=$sha" --silent 2>/dev/null; then
            echo "SKIP  $sha chua co deploy/docker/compose.yaml."
            exit 0
          fi
          echo "DEPLOY $sha chua deploy."
          if [[ "$DRY_RUN" == true ]]; then
            echo "dry-run: khong goi deploy."
            exit 0
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run deploy-salesbot.yml -R "$REPO" -f sha="$sha"
