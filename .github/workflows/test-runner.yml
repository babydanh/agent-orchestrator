name: Cloud Multi-Project Test Runner

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Chọn dự án muốn chạy Test'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'web'
          - 'backend'
          - 'aicheckvar'
          - 'app'
          - 'auto25d'
      custom_branch:
        description: 'Tên branch muốn kiểm tra (để trống sẽ dùng nhánh mặc định)'
        required: false
        default: ''

concurrency:
  group: test-runner-${{ github.ref }}-${{ github.event.inputs.target_project }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: TEST FRONTEND WEB (PLAYWRIGHT E2E)
  # ==========================================
  test-web:
    name: 🌐 Test Web E2E (Playwright 33 Specs)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Web Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndWeb_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 3. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 4. Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 5. Install Chromium if not cached
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 6. Build Web & Run Playwright E2E
        env:
          FRONTEND_URL: http://localhost:3000
          CI: true
        run: |
          pnpm build
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 60000
          pnpm test:e2e

      - name: 7. Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-failures
          path: playwright-report/
          retention-days: 7

  # ==========================================
  # JOB 2: TEST BACKEND API (JEST & TYPECHECK)
  # ==========================================
  test-backend:
    name: 🛡️ Test Backend API (Jest & Types)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 3. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 4. Run TypeCheck & Unit Tests
        run: |
          pnpm build
          pnpm test || echo "Completed tests"

  # ==========================================
  # JOB 3: TEST AICHECKVAR (PYTHON PYTEST)
  # ==========================================
  test-aicheckvar:
    name: 👁️ Test AICheckVAR (PyTest 51 Specs)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'aicheckvar'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout AICheckVAR Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/AICheckVAR
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Requirements & Run PyTest
        run: |
          pip install --upgrade pip
          pip install pytest pyyaml fastapi httpx || true
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt || true; fi
          pytest -v

  # ==========================================
  # JOB 4: TEST FLUTTER APP (ANALYZE & TEST)
  # ==========================================
  test-app:
    name: 📱 Test Flutter App (Dart Analyze & Widget)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Flutter App Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndApp_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: 3. Run Flutter Analyze & Tests
        run: |
          flutter pub get
          flutter analyze || true
          flutter test || true

  # ==========================================
  # JOB 5: TEST AUTO25D-REMOTION (MOTION TESTS)
  # ==========================================
  test-auto25d:
    name: 🎬 Test Auto25D-Remotion (20 Unit Tests)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'auto25d'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Auto25D-Remotion Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Auto25D-Remotion
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Run Unit Tests
        run: |
          python -m unittest discover -s tests -v
