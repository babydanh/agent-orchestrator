name: Cloud Multi-Project Test Runner
# Quyền tường minh: step báo cáo cần ghi Issue. Không dựa vào mặc định của repo (chưa đọc được).
permissions:
  contents: read
  issues: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Chọn dự án muốn chạy Test'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'fullstack-e2e'
          - 'web'
          - 'backend'
          - 'app'
          - 'aicheckvar'
          - 'auto25d'
      custom_branch:
        description: 'Tên branch muốn kiểm tra (để trống sẽ dùng nhánh mặc định)'
        required: false
        default: ''
      backend_ref:
        description: 'Nhánh/SHA của Backend cho fullstack-e2e (để trống = dùng custom_branch, rồi nhánh mặc định)'
        required: false
        default: ''
      web_ref:
        description: 'Nhánh/SHA của Web cho fullstack-e2e (để trống = dùng custom_branch, rồi nhánh mặc định)'
        required: false
        default: ''

concurrency:
  group: test-runner-${{ github.ref }}-${{ github.event.inputs.target_project }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: FULLSTACK INTEGRATION TEST (BẬT POSTGRES + BACKEND API + CHẠY WEB)
  # =========================================================================
  test-fullstack:
    name: 🚀 Full-Stack E2E (Postgres + Backend NestJS + Web Next.js)
    # schedule không có inputs => phải cho phép riêng, nếu không job bị skip và cron báo xanh giả.
    if: github.event_name == 'schedule' || github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'fullstack-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # CUNG CẤP DATABASE POSTGRESQL & REDIS THỰC TẾ TRÊN RUNNER
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: tournament_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Setup Node.js 22 LTS & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # CACHE 1: PNPM Global Store
      - name: 2. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-v1
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # CACHE 2: Playwright Chromium Browser Cache
      - name: 3. Setup Playwright Browser Cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1
          restore-keys: |
            ${{ runner.os }}-playwright-

      # CLONE BACKEND & START SERVICE KÈM DB SEEDING
      - name: 4. Clone Backend, Migrate & Start NestJS Service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: your_password
          DB_DATABASE: tournament_db
          DB_SSL: false
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-jwt-access-secret-key-32chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-32chars
        run: |
          mkdir -p workspace
          cd workspace
          REF="${{ github.event.inputs.backend_ref || github.event.inputs.custom_branch }}"
          git clone --depth 1 https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau.git backend
          if [ -n "$REF" ]; then
            git -C backend fetch --depth 1 origin "$REF"
            git -C backend checkout FETCH_HEAD
          fi
          cd backend
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build
          
          # Dùng đúng đường migration của Backend deploy.yml (đã kiểm chứng), KHÔNG dùng drizzle-kit push.
          node run-prod-migration.js
          # Chạy lần hai để xác nhận migration idempotent (như deploy.yml)
          node run-prod-migration.js
          pnpm verify:football-schema

          pnpm seed:prod
          
          # Khởi động Backend API
          PORT=3000 pnpm start:prod &
          cd ../..

      # CLONE WEB REPO
      - name: 5. Clone Web Repo & Install Dependencies
        run: |
          cd workspace
          REF="${{ github.event.inputs.web_ref || github.event.inputs.custom_branch }}"
          git clone --depth 1 https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/HethongFrontEndWeb_QLgiaidau.git web
          if [ -n "$REF" ]; then
            git -C web fetch --depth 1 origin "$REF"
            git -C web checkout FETCH_HEAD
          fi
          cd web
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi
          cd ../..

      # CACHE 3: Next.js Build Cache (Đặt sau khi đã clone web)
      - name: 6. Setup Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: workspace/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('workspace/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # CHỜ CẢ 2 CỔNG SẴN SÀNG VÀ CHẠY PLAYWRIGHT E2E
      - name: 7. Wait for Backend & Run Playwright E2E UI Tests
        env:
          FRONTEND_URL: http://localhost:3001
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          NEXT_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          CI: true
        run: |
          # Backend có globalPrefix /api/v1 và không có route "/" nên GET / luôn 404 -> wait-on http:// không bao giờ xong.
          # Chờ cổng TCP mở: Nest chỉ listen() sau khi khởi tạo module xong.
          npx --yes wait-on@9.5.1 tcp:localhost:3000 --timeout 60000

          cd workspace/web

          # CHỐT CHẶN AN TOÀN: không xóa/bỏ test nào. Chỉ từ chối chạy nếu còn spec nào đánh thẳng
          # vào production (tạo tài khoản/giải đấu thật trên https://sporto.asia).
          if grep -rnE "(baseURL|goto)\b.*https?://(www\.)?sporto\.asia" test/e2e; then
            echo "::error::Còn spec trỏ thẳng https://sporto.asia, từ chối chạy E2E trên CI"; exit 1
          fi

          PORT=3001 pnpm build
          PORT=3001 pnpm start &
          npx --yes wait-on@9.5.1 http-get://localhost:3001 --timeout 90000
          pnpm test:e2e

      - name: 8. Generate Allure Report Dashboard
        if: always()
        run: |
          cd workspace/web
          npx allure generate allure-results --clean -o allure-report || echo "Allure generate completed"
          cd ../..

      - name: 9. Upload Allure & Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-allure-dashboard
          path: |
            workspace/web/allure-report/
            workspace/web/playwright-report/
          retention-days: 7

      - name: 10. Báo kết quả vào Issue cố định
        if: always() && (github.event_name == 'schedule' || github.event.inputs.target_project == 'fullstack-e2e')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, collections, urllib.request
          # Gộp theo historyId để retry không bị đếm nhiều lần; lấy lần chạy cuối của mỗi test.
          by = {}
          for f in glob.glob('workspace/web/allure-report/data/test-cases/*.json'):
              d = json.load(open(f, encoding='utf-8'))
              key = d.get('historyId') or d.get('fullName') or d.get('name')
              start = (d.get('time') or {}).get('start') or 0
              if key not in by or start > by[key][0]:
                  by[key] = (start, d)
          st = collections.Counter(v[1].get('status') for v in by.values())
          total = len(by)
          if total == 0:
              summary = 'KHÔNG có kết quả test nào (suite không chạy tới Playwright hoặc report rỗng).'
          else:
              summary = f"{total} test: pass {st.get('passed',0)}, fail {st.get('failed',0)}, broken {st.get('broken',0)}, skipped {st.get('skipped',0)}"
          body = f"**E2E đêm** | job: `{os.environ['JOB_STATUS']}`\n\n{summary}\n\nRun: {os.environ['RUN_URL']}"
          repo = os.environ['REPO']
          H = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'nightly'}
          def call(path, data=None):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=H, data=json.dumps(data).encode() if data else None, method='POST' if data else 'GET')
              return json.loads(urllib.request.urlopen(req).read().decode())
          TITLE = '[Nightly] Kết quả E2E hằng đêm'
          issues = call('/issues?state=open&per_page=100')
          num = next((i['number'] for i in issues if i['title'] == TITLE and 'pull_request' not in i), None)
          if num is None:
              num = call('/issues', {'title': TITLE, 'body': 'Issue cố định: mỗi đêm workflow tự thêm một comment kết quả.'})['number']
          call(f'/issues/{num}/comments', {'body': body})
          print('Đã ghi kết quả vào issue #', num)
          PY

  # ==========================================
  # JOB 2: TEST ISOLATED WEB UI (PLAYWRIGHT)
  # ==========================================
  test-web:
    name: 🌐 Isolated Web UI (Playwright 33 Specs)
    if: github.event.inputs.target_project == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Web Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndWeb_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-web-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-web-

      - name: 4. Setup Playwright Chromium Cache
        uses: actions/cache@v4
        id: playwright-cache-web
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 5. Setup Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-build-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-build-

      - name: 6. Install Packages & Run Tests
        env:
          FRONTEND_URL: http://localhost:3000
          CI: true
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          if [ "${{ steps.playwright-cache-web.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi
          pnpm build
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 60000
          pnpm test:e2e

      - name: 7. Generate Allure Report Dashboard
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report || echo "Allure generate completed"

      - name: 8. Upload Allure Dashboard & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-dashboard
          path: |
            allure-report/
            playwright-report/
          retention-days: 7

  # ==========================================
  # JOB 3: TEST BACKEND API (JEST & TYPES)
  # ==========================================
  test-backend:
    name: 🛡️ Test Backend API (Jest & Types)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-backend-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-backend-

      - name: 4. Install & Test (Báo lỗi thật, không nuốt lỗi)
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build
          pnpm test

  # ==========================================
  # JOB 4: TEST FLUTTER APP (ANALYZE & TEST)
  # ==========================================
  test-app:
    name: 📱 Test Flutter App (Dart Analyze & Widget)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Flutter App Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndApp_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: 3. Run Flutter Analyze & Tests (Báo lỗi thật, không nuốt lỗi)
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # ==========================================
  # JOB 5: TEST AICHECKVAR (PYTHON PYTEST)
  # ==========================================
  test-aicheckvar:
    name: 👁️ Test AICheckVAR (PyTest 51 Specs)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'aicheckvar'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout AICheckVAR Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/AICheckVAR
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Requirements & Run PyTest
        run: |
          pip install --upgrade pip
          pip install pytest pyyaml fastapi httpx || true
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt || true; fi
          pytest -v

  # ==========================================
  # JOB 6: TEST AUTO25D-REMOTION (MOTION TESTS)
  # ==========================================
  test-auto25d:
    name: 🎬 Test Auto25D-Remotion (20 Unit Tests)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'auto25d'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Auto25D-Remotion Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Auto25D-Remotion
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Run Unit Tests
        run: |
          python -m unittest discover -s tests -v
