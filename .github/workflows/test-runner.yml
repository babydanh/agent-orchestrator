name: Cloud Multi-Project Test Runner

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Chọn dự án muốn chạy Test'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'fullstack-e2e'
          - 'web'
          - 'backend'
          - 'app'
          - 'aicheckvar'
          - 'auto25d'
      custom_branch:
        description: 'Tên branch muốn kiểm tra (để trống sẽ dùng nhánh mặc định)'
        required: false
        default: ''

concurrency:
  group: test-runner-${{ github.ref }}-${{ github.event.inputs.target_project }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: FULLSTACK INTEGRATION TEST (BẬT BACKEND API + CHẠY PLAYWRIGHT WEB)
  # =========================================================================
  test-fullstack:
    name: 🚀 Full-Stack E2E (Backend NestJS + Web Next.js)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'fullstack-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Setup Node.js 22 LTS & PNPM
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # CACHE 1: PNPM Global Store (Không tải lại packages)
      - name: 2. Get PNPM Store Directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # CACHE 2: Playwright Chromium Browser Cache
      - name: 4. Setup Playwright Browser Cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1
          restore-keys: |
            ${{ runner.os }}-playwright-

      # CACHE 3: Next.js Build Cache (Tăng tốc Next build từ 2 phút còn 15 giây)
      - name: 5. Setup Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: 6. Clone Backend Repo & Start Mock/Dev Service
        run: |
          mkdir -p workspace
          cd workspace
          git clone --depth 1 https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau.git backend
          cd backend
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build
          PORT=3000 pnpm start:prod &
          cd ../..

      - name: 7. Clone Web Repo & Install Dependencies
        run: |
          cd workspace
          git clone --depth 1 https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/HethongFrontEndWeb_QLgiaidau.git web
          cd web
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi
          cd ../..

      - name: 8. Build Web & Run Playwright E2E UI Tests
        env:
          FRONTEND_URL: http://localhost:3001
          CI: true
        run: |
          cd workspace/web
          PORT=3001 pnpm build
          PORT=3001 pnpm start &
          npx wait-on http://localhost:3001 --timeout 60000
          pnpm test:e2e

      - name: 9. Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-playwright-failures
          path: workspace/web/playwright-report/
          retention-days: 7

  # ==========================================
  # JOB 2: TEST ISOLATED WEB UI (PLAYWRIGHT)
  # ==========================================
  test-web:
    name: 🌐 Isolated Web UI (Playwright 33 Specs)
    if: github.event.inputs.target_project == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Web Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndWeb_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-web-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-web-

      - name: 4. Setup Playwright Chromium Cache
        uses: actions/cache@v4
        id: playwright-cache-web
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 5. Setup Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-build-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-build-

      - name: 6. Install Packages & Run Tests
        env:
          FRONTEND_URL: http://localhost:3000
          CI: true
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          if [ "${{ steps.playwright-cache-web.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi
          pnpm build
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 60000
          pnpm test:e2e

      - name: 7. Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-failures
          path: playwright-report/
          retention-days: 7

  # ==========================================
  # JOB 3: TEST BACKEND API (JEST & TYPES)
  # ==========================================
  test-backend:
    name: 🛡️ Test Backend API (Jest & Types)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-backend-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-backend-

      - name: 4. Install & Test
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build
          pnpm test || echo "Backend test finished"

  # ==========================================
  # JOB 4: TEST FLUTTER APP (ANALYZE & TEST)
  # ==========================================
  test-app:
    name: 📱 Test Flutter App (Dart Analyze & Widget)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Flutter App Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndApp_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: 3. Run Flutter Analyze & Tests
        run: |
          flutter pub get
          flutter analyze || true
          flutter test || true
