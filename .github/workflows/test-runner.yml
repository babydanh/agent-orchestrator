name: Cloud Multi-Project Test Runner
# Tên lượt chạy mang mã yêu cầu để script local nhận đúng lượt của mình khi nhiều session chạy song song.
run-name: "test ${{ github.event.inputs.target_project || 'schedule' }} web=${{ github.event.inputs.web_ref || github.event.inputs.custom_branch || 'main' }} #${{ github.event.inputs.request_id || github.run_id }}"
# Quyền tường minh: step báo cáo cần ghi Issue. Không dựa vào mặc định của repo (chưa đọc được).
permissions:
  contents: read
  issues: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Chọn dự án muốn chạy Test'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'fullstack-e2e'
          - 'web'
          - 'backend'
          - 'api-contract'
          - 'app'
          - 'app-e2e'
          - 'aicheckvar'
          - 'auto25d'
      custom_branch:
        description: 'Tên branch muốn kiểm tra (để trống sẽ dùng nhánh mặc định)'
        required: false
        default: ''
      backend_ref:
        description: 'Nhánh/SHA của Backend cho fullstack-e2e (để trống = dùng custom_branch, rồi nhánh mặc định)'
        required: false
        default: ''
      web_ref:
        description: 'Nhánh/SHA của Web cho fullstack-e2e (để trống = dùng custom_branch, rồi nhánh mặc định)'
        required: false
        default: ''
      app_ref:
        description: 'Nhánh/SHA của App cho app-e2e (để trống = dùng custom_branch, rồi nhánh mặc định)'
        required: false
        default: ''
      specs:
        description: 'Chỉ chạy các file này (cách nhau bằng dấu cách). fullstack-e2e: vd test/e2e/a.spec.ts. app-e2e: vd integration_test/smoke_test.dart. Để trống = toàn bộ'
        required: false
        default: ''
      request_id:
        description: 'Mã yêu cầu duy nhất do cloud-test-runner.py tạo (để nhận đúng lượt chạy khi chạy song song)'
        required: false
        default: ''
      fail_fast:
        description: 'true = dừng sau 3 test hỏng và không chạy lại test hỏng (cổng gộp merge-lane: đỏ thì biết sớm)'
        required: false
        default: 'false'
      seed:
        description: 'Dữ liệu mẫu cho fullstack-e2e. "data" = chạy thêm `pnpm seed:data` của Backend (seed-data-prod.ts: 13 giải 4 thể thức ở trạng thái mở đăng ký/đang đấu/đã kết thúc, 24 VĐV mật khẩu Player@123, BTC macter.970 & hxlinh1683 / Test@123, admin vndcsport@gmail.com / Admin@123). Để trống = chỉ seed:prod như cũ'
        required: false
        default: ''

# Mỗi yêu cầu một nhóm riêng: nhiều session chạy SONG SONG (repo public: tới 20 job cùng lúc), không lượt nào huỷ lượt
# của session khác. Mỗi job tự dựng Postgres/Backend/Web riêng trên máy của nó nên không giẫm nhau.
concurrency:
  group: test-runner-${{ github.event.inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: FULLSTACK INTEGRATION TEST (BẬT POSTGRES + BACKEND API + CHẠY WEB)
  # =========================================================================
  test-fullstack:
    name: "🚀 Full-Stack E2E shard ${{ matrix.shard }}/${{ strategy.job-total }} (Postgres + Backend NestJS + Web Next.js)"
    # schedule không có inputs => phải cho phép riêng, nếu không job bị skip và cron báo xanh giả.
    if: github.event_name == 'schedule' || github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'fullstack-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Cả bộ (specs trống) chia 4 máy, mỗi máy Postgres/Backend/Web riêng nên spec không giẫm dữ liệu của nhau.
      # Lượt chọn spec chạy 1 máy như cũ. Không huỷ shard khác khi một shard đỏ: script tổng kết coi job bị huỷ là
      # lỗi hạ tầng, sẽ che mất lỗi test thật. Điều kiện "cả bộ" lặp lại ở job report-fullstack.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event.inputs.specs == '') && '[1,2,3,4]' || '[1]') }}

    # CUNG CẤP DATABASE POSTGRESQL & REDIS THỰC TẾ TRÊN RUNNER
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: tournament_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Setup Node.js 22 LTS & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Chỉ lấy script chia shard / báo cáo của orchestrator, không lấy cả repo.
      - uses: actions/checkout@v4
        with:
          path: orchestrator
          sparse-checkout: scripts/e2e

      # Clone trước để khoá cache theo đúng lockfile và đúng bản Playwright của nhánh đang test.
      - name: 2. Clone Backend & Web
        id: clone
        run: |
          mkdir -p workspace
          cd workspace
          REF="${{ github.event.inputs.backend_ref || github.event.inputs.custom_branch }}"
          git clone --depth 1 https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau.git backend
          if [ -n "$REF" ]; then
            git -C backend fetch --depth 1 origin "$REF"
            git -C backend checkout FETCH_HEAD
          fi
          REF="${{ github.event.inputs.web_ref || github.event.inputs.custom_branch }}"
          git clone --depth 1 https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/HethongFrontEndWeb_QLgiaidau.git web
          if [ -n "$REF" ]; then
            git -C web fetch --depth 1 origin "$REF"
            git -C web checkout FETCH_HEAD
          fi
          echo "pnpm_store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(grep -m1 -oE '^  playwright-core@[0-9.]+' web/pnpm-lock.yaml | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      # CACHE 1: PNPM store. Khoá cũ cố định (pnpm-store-v1) không bao giờ lưu lại nên store cũ không dùng được
      # (log: "reused 0", tải lại toàn bộ gói mỗi lượt).
      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.clone.outputs.pnpm_store }}
          key: ${{ runner.os }}-pnpm12-store-${{ hashFiles('workspace/backend/pnpm-lock.yaml', 'workspace/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm12-store-

      # CACHE 2: Chromium theo đúng bản Playwright; khoá cố định cũ sẽ báo cache-hit cả khi Playwright đã lên bản mới.
      - name: 4. Setup Playwright Browser Cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.clone.outputs.playwright }}

      # CACHE 3: Next.js Build Cache
      - name: 5. Setup Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: workspace/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('workspace/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # Backend (cài, build, migrate, seed: ~60-110 giây, phần lớn chờ mạng) và Web (cài, build) không phụ thuộc
      # nhau nên chạy song song. Log Web in ra sau, khi Web xong.
      - name: 6. Dựng Backend (migrate, seed, start) và build Web song song
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: your_password
          DB_DATABASE: tournament_db
          DB_SSL: false
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-jwt-access-secret-key-32chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-32chars
          # Next nhúng biến NEXT_PUBLIC_* lúc build.
          FRONTEND_URL: http://localhost:3001
          NEXT_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          CI: true
        run: |
          (
            set -e
            cd workspace/web
            pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
            if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
              npx playwright install --with-deps chromium
            fi
            PORT=3001 pnpm build
          ) > "$RUNNER_TEMP/web-prep.log" 2>&1 &
          WEB_PID=$!

          cd workspace/backend
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build

          # Dùng đúng đường migration của Backend deploy.yml (đã kiểm chứng), KHÔNG dùng drizzle-kit push.
          node run-prod-migration.js
          # Chạy lần hai để xác nhận migration idempotent (như deploy.yml)
          node run-prod-migration.js
          pnpm verify:football-schema

          pnpm seed:prod

          # Dữ liệu mẫu (tuỳ chọn): seed-data-prod.ts chỉ ghi DB của job này (DB_HOST=localhost ở trên), không gọi API,
          # không xoá gì, chạy lại không tạo trùng (bỏ qua giải đã có).
          if [ "${{ github.event.inputs.seed }}" = "data" ]; then
            pnpm seed:data
            PGPASSWORD=your_password psql -h localhost -U postgres -d tournament_db -c \
              "SELECT status, count(*) AS so_giai FROM tournaments GROUP BY status ORDER BY status;"
            PGPASSWORD=your_password psql -h localhost -U postgres -d tournament_db -tAc \
              "SELECT 'tran: ' || count(*) || ', da xong: ' || count(*) FILTER (WHERE status = 'COMPLETED') FROM matches;"
          fi

          # Khởi động Backend API
          PORT=3000 pnpm start:prod &

          echo "::group::Log cài và build Web"
          WEB_OK=0
          wait "$WEB_PID" || WEB_OK=$?
          cat "$RUNNER_TEMP/web-prep.log"
          echo "::endgroup::"
          if [ "$WEB_OK" != 0 ]; then
            echo "::error::Cài/build Web lỗi (exit $WEB_OK), xem nhóm log 'Log cài và build Web'"; exit 1
          fi

      # CHỜ CẢ 2 CỔNG SẴN SÀNG VÀ CHẠY PLAYWRIGHT E2E
      - name: 7. Wait for Backend & Run Playwright E2E UI Tests
        env:
          FRONTEND_URL: http://localhost:3001
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          NEXT_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          CI: true
          SPECS: ${{ github.event.inputs.specs }}
          FAIL_FAST: ${{ github.event.inputs.fail_fast }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          # Spec biết job có dữ liệu mẫu hay không (seed=data) để tự bỏ qua ca cần dữ liệu khi chạy trên DB trống.
          E2E_SEED: ${{ github.event.inputs.seed }}
        run: |
          # Backend có globalPrefix /api/v1 và không có route "/" nên GET / luôn 404 -> wait-on http:// không bao giờ xong.
          # Chờ cổng TCP mở: Nest chỉ listen() sau khi khởi tạo module xong.
          npx --yes wait-on@9.5.1 tcp:localhost:3000 --timeout 60000

          # seed:prod không tạo tài khoản đăng nhập mà spec dùng mặc định (test/e2e/p0/fixtures.ts,
          # quick-tournament.spec.ts): không có bước này thì spec đăng nhập luôn kẹt ở /login.
          # Tạo qua chính API register (băm mật khẩu như thật); 409 = đã có thì bỏ qua.
          for account in "admin1@gmail.com:E2E Organizer" "user8@gmail.com:E2E Player"; do
            email="${account%%:*}"; name="${account#*:}"
            code=$(curl -s -o /tmp/register.json -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/register \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$email\",\"password\":\"123456\",\"fullName\":\"$name\"}")
            if [ "$code" != "201" ] && [ "$code" != "409" ]; then
              echo "::error::Tạo tài khoản E2E $email lỗi HTTP $code"; cat /tmp/register.json; exit 1
            fi
            echo "Tài khoản E2E $email: HTTP $code"
          done
          # Register chỉ cho role PLAYER, email chưa xác thực; layout /organizer chặn cả hai.
          # admin1 là tài khoản Ban tổ chức của spec (quick-tournament, p0 organizerEmail), nên cấp ORGANIZER + xác thực email.
          PGPASSWORD=your_password psql -h localhost -U postgres -d tournament_db -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE users SET is_email_verified = true WHERE email IN ('admin1@gmail.com', 'user8@gmail.com');
          INSERT INTO roles (name, slug, description) VALUES ('ORGANIZER', 'organizer', 'Ban tổ chức') ON CONFLICT DO NOTHING;
          INSERT INTO user_to_roles (user_id, role_id)
            SELECT u.id, r.id FROM users u JOIN roles r ON r.name = 'ORGANIZER' WHERE u.email = 'admin1@gmail.com'
            ON CONFLICT DO NOTHING;
          SQL

          # seed=data: kiểm khói qua API THẬT trước khi chạy spec, để biết dữ liệu mẫu dùng được chứ không chỉ nằm trong DB.
          # Hỏng là dừng job: chạy spec trên dữ liệu không đăng nhập được thì kết quả không có nghĩa.
          if [ "$E2E_SEED" = "data" ]; then
            API=http://localhost:3000/api/v1
            for cred in "vndcsport@gmail.com:Admin@123" "macter.970@gmail.com:Test@123" "danh.nguyen@gmail.com:Player@123"; do
              email="${cred%%:*}"; pass="${cred#*:}"
              code=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST "$API/auth/mobile/login" \
                -H 'Content-Type: application/json' -d "{\"email\":\"$email\",\"password\":\"$pass\"}")
              token=$(jq -r '.data.accessToken // .accessToken // empty' /tmp/login.json)
              if [ "$code" != "200" ] && [ "$code" != "201" ] || [ -z "$token" ]; then
                echo "::error::Dữ liệu mẫu: không đăng nhập được $email (HTTP $code)"; head -c 300 /tmp/login.json; exit 1
              fi
              echo "Dữ liệu mẫu: đăng nhập $email OK (HTTP $code)"
              [ "$email" = "macter.970@gmail.com" ] && ORG_TOKEN="$token"
            done
            # Giải công khai Backend trả về, và giải mà BTC macter.970 quản lý (seed chia 13 giải cho 2 BTC).
            # Chỉ đếm đối tượng có trạng thái của GIẢI: phản hồi có đối tượng con cũng mang inviteCode (trạng thái ACTIVE).
            curl -s "$API/tournaments?limit=50" -o /tmp/public.json
            echo "Dữ liệu mẫu: API /tournaments trả $(jq '[.. | objects | select(has("inviteCode") and (.status | IN("DRAFT","REGISTRATION_OPEN","REGISTRATION_CLOSED","IN_PROGRESS","COMPLETED","CANCELLED")))] | length' /tmp/public.json) giải;" \
              "theo trạng thái: $(jq -c '[.. | objects | select(has("inviteCode") and (.status | IN("DRAFT","REGISTRATION_OPEN","REGISTRATION_CLOSED","IN_PROGRESS","COMPLETED","CANCELLED"))) | .status] | group_by(.) | map({(.[0]): length}) | add' /tmp/public.json)"
            curl -s "$API/tournaments/my/management" -H "Authorization: Bearer $ORG_TOKEN" -o /tmp/manage.json
            n=$(jq '[.. | objects | select(has("inviteCode") and (.status | IN("DRAFT","REGISTRATION_OPEN","REGISTRATION_CLOSED","IN_PROGRESS","COMPLETED","CANCELLED")))] | length' /tmp/manage.json)
            echo "Dữ liệu mẫu: BTC macter.970 thấy $n giải trong trang quản lý"
            if [ "$n" -lt 1 ]; then echo "::error::Dữ liệu mẫu: BTC không thấy giải nào"; head -c 400 /tmp/manage.json; exit 1; fi
          fi

          cd workspace/web

          # CHỐT CHẶN AN TOÀN: không xóa/bỏ test nào. Chỉ từ chối chạy nếu còn spec nào đánh thẳng
          # vào production (tạo tài khoản/giải đấu thật trên https://sporto.asia).
          if grep -rnE "(baseURL|goto)\b.*https?://(www\.)?sporto\.asia" test/e2e; then
            echo "::error::Còn spec trỏ thẳng https://sporto.asia, từ chối chạy E2E trên CI"; exit 1
          fi

          PORT=3001 pnpm start &
          npx --yes wait-on@9.5.1 http-get://localhost:3001 --timeout 90000
          # SPECS đi qua env (không nội suy vào script) và chỉ nhận ký tự đường dẫn.
          if [ -n "$SPECS" ] && ! printf '%s' "$SPECS" | grep -qE '^[A-Za-z0-9_./ -]+$'; then
            echo "::error::specs chứa ký tự không hợp lệ"; exit 1
          fi
          # Cả bộ chia nhiều máy: shard này chạy phần của nó, cân theo thời gian đã đo (spec-durations.json).
          if [ "$SHARD_TOTAL" -gt 1 ]; then
            SPECS=$(python3 "$GITHUB_WORKSPACE/orchestrator/scripts/e2e/shard_specs.py" --root test/e2e --shard "$SHARD/$SHARD_TOTAL" | tr '\n' ' ')
            if [ -z "${SPECS// /}" ]; then echo "Shard $SHARD/$SHARD_TOTAL không có spec nào"; exit 0; fi
          fi
          # shellcheck disable=SC2086
          pnpm test:e2e $SPECS $([ "$FAIL_FAST" = "true" ] && echo "--max-failures=3 --retries=0")

      - name: 8. Generate Allure Report Dashboard
        if: always() && strategy.job-total == 1
        run: |
          cd workspace/web
          npx allure generate allure-results --clean -o allure-report || echo "Allure generate completed"
          cd ../..

      # 1 shard: dashboard đã dựng sẵn (tên artifact cũ). Nhiều shard: kết quả thô để job report-fullstack gộp.
      - name: 9. Upload Allure & Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ strategy.job-total == 1 && 'fullstack-allure-dashboard' || format('fullstack-e2e-shard-{0}', matrix.shard) }}
          path: |
            workspace/web/allure-report/
            workspace/web/allure-results/
            workspace/web/playwright-report/
          retention-days: 7

      - name: 10. Báo kết quả vào Issue cố định
        if: always() && strategy.job-total == 1 && (github.event_name == 'schedule' || github.event.inputs.target_project == 'fullstack-e2e')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: python3 orchestrator/scripts/e2e/nightly_report.py workspace/web/allure-report

  # Gộp kết quả các shard của lượt chạy cả bộ thành một dashboard Allure và một dòng báo cáo.
  report-fullstack:
    name: 📊 Gộp kết quả E2E các shard
    needs: test-fullstack
    # Cùng điều kiện "cả bộ" với matrix của test-fullstack.
    if: always() && needs.test-fullstack.result != 'skipped' && (github.event_name == 'schedule' || github.event.inputs.specs == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: orchestrator
          sparse-checkout: scripts/e2e
      - uses: actions/download-artifact@v4
        with:
          pattern: fullstack-e2e-shard-*
          path: shards
      - name: Gộp Allure các shard
        run: |
          shopt -s nullglob
          dirs=(shards/*/allure-results)
          echo "Kết quả Allure của ${#dirs[@]} shard"
          if [ ${#dirs[@]} -gt 0 ]; then
            npx --yes allure-commandline@2.46.1 generate "${dirs[@]}" --clean -o allure-report
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fullstack-allure-dashboard
          path: |
            allure-report/
            shards/*/playwright-report/
          retention-days: 7
      - name: Báo kết quả vào Issue cố định
        if: github.event_name == 'schedule' || github.event.inputs.target_project == 'fullstack-e2e'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ needs.test-fullstack.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: python3 orchestrator/scripts/e2e/nightly_report.py allure-report

  # ==========================================
  # JOB 2: TEST ISOLATED WEB UI (PLAYWRIGHT)
  # ==========================================
  test-web:
    name: 🌐 Isolated Web UI (Playwright 33 Specs)
    if: github.event.inputs.target_project == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Web Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndWeb_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-web-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-web-

      - name: 4. Setup Playwright Chromium Cache
        uses: actions/cache@v4
        id: playwright-cache-web
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 5. Setup Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-build-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-build-

      - name: 6. Install Packages & Run Tests
        env:
          FRONTEND_URL: http://localhost:3000
          CI: true
          SPECS: ${{ github.event.inputs.specs }}
          FAIL_FAST: ${{ github.event.inputs.fail_fast }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          if [ "${{ steps.playwright-cache-web.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi
          pnpm build
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 60000
          if [ -n "$SPECS" ] && ! printf '%s' "$SPECS" | grep -qE '^[A-Za-z0-9_./ -]+$'; then
            echo "::error::specs chứa ký tự không hợp lệ"; exit 1
          fi
          # shellcheck disable=SC2086
          pnpm test:e2e $SPECS $([ "$FAIL_FAST" = "true" ] && echo "--max-failures=3 --retries=0")

      - name: 7. Generate Allure Report Dashboard
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report || echo "Allure generate completed"

      - name: 8. Upload Allure Dashboard & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-dashboard
          path: |
            allure-report/
            playwright-report/
          retention-days: 7

  # ==========================================
  # JOB 3: TEST BACKEND API (JEST & TYPES)
  # ==========================================
  test-backend:
    name: 🛡️ Test Backend API (Jest & Types)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-backend-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-backend-

      - name: 4. Install & Test (Báo lỗi thật, không nuốt lỗi)
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build
          pnpm test

  # =====================================================================
  # JOB: HỢP ĐỒNG API BACKEND (OpenAPI xuất không cần DB + oasdiff so main)
  # =====================================================================
  test-api-contract:
    name: 📜 API contract (OpenAPI + oasdiff)
    if: github.event.inputs.target_project == 'api-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.backend_ref || github.event.inputs.custom_branch || 'main' }}
          # Cần origin/main để lấy openapi.json làm mốc so sánh.
          fetch-depth: 0

      - name: 2. Setup Node.js & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-backend-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-backend-

      - name: 4. Build & xuất OpenAPI (preview, không cần DB/Redis)
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build
          pnpm openapi:export
          mkdir -p contract
          cp openapi.json contract/branch.json
          echo "Số path: $(node -e "console.log(Object.keys(require('./openapi.json').paths||{}).length)")"

      - name: 5. openapi.json đã commit phải khớp bản vừa xuất
        run: |
          if ! git ls-files --error-unmatch openapi.json >/dev/null 2>&1; then
            echo "::warning::openapi.json chưa được commit (lượt baseline): tải artifact openapi-spec, commit file branch.json thành openapi.json ở gốc repo Backend"
          elif ! git diff --quiet -- openapi.json; then
            echo "::error::openapi.json đã commit KHÁC bản vừa xuất. Chạy: pnpm build && pnpm openapi:export rồi commit openapi.json"
            git diff --stat -- openapi.json
            exit 1
          fi

      - name: 6. So thay đổi phá vỡ với main (oasdiff)
        run: |
          if git show origin/main:openapi.json > contract/main.json 2>/dev/null; then
            docker run --rm -v "$PWD/contract:/specs" tufin/oasdiff:latest breaking /specs/main.json /specs/branch.json --fail-on ERR --format text
          else
            rm -f contract/main.json
            echo "main chưa có openapi.json: bỏ qua so phá vỡ (lượt baseline)"
          fi

      - name: 7. Upload bản mô tả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: contract/
          retention-days: 7

  # ==========================================
  # JOB 4: TEST FLUTTER APP (ANALYZE & TEST)
  # ==========================================
  test-app:
    name: 📱 Test Flutter App (Dart Analyze & Widget)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Flutter App Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndApp_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # App pubspec needs Dart ^3.10.3; 3.29.x ships Dart 3.7. Same line as the dev machine (3.47, Dart 3.13).
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: 3. Run Flutter Analyze & Tests (Báo lỗi thật, không nuốt lỗi)
        run: |
          # pubspec bundles .env as an asset; the repo ships only .env.example (no secrets).
          [ -f .env ] || cp .env.example .env
          flutter pub get
          # Errors fail the job; the ~200 existing info/warning lints are reported, not fatal.
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

  # =========================================================================
  # JOB E2E APP: integration_test CHẠY TRÊN EMULATOR ANDROID + BACKEND THẬT
  # =========================================================================
  # Chỉ chạy khi chọn target_project = app-e2e (không nằm trong 'all', không theo lịch).
  test-app-e2e:
    name: 📱🧪 E2E Flutter App (emulator Android API 34 + Backend thật)
    if: github.event.inputs.target_project == 'app-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    # Postgres + Redis giống test-fullstack: Backend thật cần cả hai.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: tournament_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Setup Node.js 22 LTS & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 2. Setup Java 17 (Gradle của Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Backend lấy backend_ref hoặc main. KHÔNG lấy custom_branch: đó là nhánh App, Backend không có nhánh đó.
      - name: 3. Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongBackendApi_QuanlyGiaiDau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.backend_ref || 'main' }}
          path: backend

      # App lấy app_ref, rồi custom_branch (--branch của script), rồi main.
      - name: 4. Checkout App
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HethongFrontEndApp_QLgiaidau
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.app_ref || github.event.inputs.custom_branch || 'main' }}
          path: app

      # Cache ~/.gradle: build APK lạnh mất 509s (run 39116901048). setup-gradle lưu cache cả khi job đỏ (post-if: !cancelled()),
      # khác setup-java cache: gradle (chỉ lưu khi xanh). 'basic' = cache GitHub Actions mã nguồn mở; mặc định 'enhanced' là dịch vụ thương mại.
      # Phải đặt SAU checkout App: bản basic băm app/android/**/*.gradle* làm khóa ngay lúc chạy (run 39120169623 lỗi "No file matched").
      # Chỉ ghi cache khi chạy trên nhánh mặc định (main); nhánh khác chỉ đọc.
      - name: 4b. Cache Gradle (setup-gradle)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 5. Kiểm tra danh sách spec đầu vào
        env:
          E2E_SPECS: ${{ github.event.inputs.specs }}
        run: |
          for s in $E2E_SPECS; do
            case "$s" in
              integration_test/*_test.dart) ;;
              *) echo "::error::Spec không hợp lệ cho app-e2e: $s (phải là integration_test/<tên>_test.dart)"; exit 1 ;;
            esac
            case "$s" in
              *..*) echo "::error::Spec chứa '..': $s"; exit 1 ;;
            esac
          done

      # Backend giống test-fullstack. Luôn nạp seed:data: tài khoản ADMIN (vndcsport) chỉ có trong seed:data và app-e2e cần nó để duyệt giải qua API.
      - name: 6. Backend migrate, seed, khởi động NestJS
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: your_password
          DB_DATABASE: tournament_db
          DB_SSL: false
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-jwt-access-secret-key-32chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-32chars
        run: |
          cd backend
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --prefer-offline
          pnpm build
          node run-prod-migration.js
          node run-prod-migration.js
          pnpm verify:football-schema
          pnpm seed:prod
          pnpm seed:data
          PORT=3000 pnpm start:prod > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "Backend khởi động, log: $RUNNER_TEMP/backend.log"

      - name: 7. Chờ Backend và tạo tài khoản E2E
        run: |
          npx --yes wait-on@9.5.1 tcp:localhost:3000 --timeout 120000
          for account in "admin1@gmail.com:E2E Organizer" "user8@gmail.com:E2E Player"; do
            email="${account%%:*}"; name="${account#*:}"
            code=$(curl -s -o /tmp/register.json -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/register \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$email\",\"password\":\"123456\",\"fullName\":\"$name\"}")
            if [ "$code" != "201" ] && [ "$code" != "409" ]; then
              echo "::error::Tạo tài khoản E2E $email lỗi HTTP $code"; cat /tmp/register.json; exit 1
            fi
            echo "Tài khoản E2E $email: HTTP $code"
          done
          PGPASSWORD=your_password psql -h localhost -U postgres -d tournament_db -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE users SET is_email_verified = true WHERE email IN ('admin1@gmail.com', 'user8@gmail.com');
          INSERT INTO roles (name, slug, description) VALUES ('ORGANIZER', 'organizer', 'Ban tổ chức') ON CONFLICT DO NOTHING;
          INSERT INTO user_to_roles (user_id, role_id)
            SELECT u.id, r.id FROM users u JOIN roles r ON r.name = 'ORGANIZER' WHERE u.email = 'admin1@gmail.com'
            ON CONFLICT DO NOTHING;
          SQL

      - name: 8. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # App cần Dart ^3.10.3; cùng dòng 3.47 với máy dev.
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: 9. Tạo .env từ .env.example (chỉ đổi API_BASE_URL và APP_API_KEY)
        working-directory: app
        run: |
          cp .env.example .env
          sed -i 's|^API_BASE_URL=.*|API_BASE_URL=http://10.0.2.2:3000/api/v1|' .env
          sed -i 's|^APP_API_KEY=.*|APP_API_KEY=|' .env
          grep -q '^API_BASE_URL=' .env || echo 'API_BASE_URL=http://10.0.2.2:3000/api/v1' >> .env
          grep -q '^APP_API_KEY=' .env || echo 'APP_API_KEY=' >> .env
          grep '^API_BASE_URL=' .env

      - name: 10. Flutter pub get
        working-directory: app
        run: flutter pub get

      # Build debug cần google-services.json: plugin Gradle áp cứng và file này gitignored.
      # File giả chỉ để Gradle chạy; Firebase lỗi khi khởi tạo và app đã bắt lỗi đó (push_notification_service.dart:37-107).
      - name: 10b. Tạo google-services.json giả cho build debug (không commit)
        working-directory: app
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "e2e-placeholder",
              "storage_bucket": "e2e-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "vn.vnsport.quanlygiaidau" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "e2e-placeholder-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # NDK 28.2 và CMake 3.22.1 do AGP tải vào SDK khi build APK lạnh: riêng NDK tốn ~5 phút (run 39118510032, bước 13).
      # Cache thư mục SDK của runner. Bước 13a lưu cache sau khi APK đã build (NDK đã cài đủ), kể cả khi test đỏ.
      - name: 10c. Xác định thư mục Android SDK
        id: sdk
        run: |
          echo "dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_OUTPUT"

      - name: 10d. Khôi phục NDK và CMake từ cache
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.sdk.outputs.dir }}/ndk
            ${{ steps.sdk.outputs.dir }}/cmake
          key: ${{ runner.os }}-android-ndk-cmake-${{ hashFiles('app/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-ndk-cmake-

      - name: 11. Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Script ghi ra file để emulator-runner chỉ gọi một dòng lệnh (multi-line trong 'script' chạy từng dòng riêng).
      - name: 12. Ghi script chạy E2E
        run: |
          cat > "$RUNNER_TEMP/run-e2e.sh" <<'SH'
          #!/usr/bin/env bash
          # Chạy trong thư mục app (working-directory của emulator-runner).
          mkdir -p app-e2e-report
          echo "MỐC $(date -u +%H:%M:%S) UTC: emulator sẵn sàng; khởi động mất $(( $(date +%s) - ${E2E_BOOT_T0:-$(date +%s)} )) s (gồm cài SDK/AVD và boot)"
          if [ -n "${E2E_SPECS:-}" ]; then
            read -r -a SPECS_ARR <<< "$E2E_SPECS"
          else
            SPECS_ARR=(integration_test)
          fi
          echo "Thiết bị đang chạy:"; adb devices
          # timeout 40 phút: run 39103144997 treo sau khi cài APK, không có dòng test nào (>50 phút). Quá hạn thì RC khác 0; bước 13b/13c vẫn chạy (if: always()).
          T_TEST0=$(date +%s)
          echo "MỐC $(date -u +%H:%M:%S) UTC: bắt đầu flutter test (mỗi file test: Gradle assembleDebug, cài APK, chạy)"
          timeout --kill-after=60 2400 flutter test --no-pub -d emulator-5554 --reporter expanded "${SPECS_ARR[@]}" 2>&1 | tee app-e2e-report/flutter-test.log
          RC=${PIPESTATUS[0]}
          T_TEST1=$(date +%s)
          GRADLE_S=$(grep -oE "assembleDebug'[^0-9]*[0-9]+\.[0-9]+s" app-e2e-report/flutter-test.log | grep -oE "[0-9]+\.[0-9]+" | awk '{s+=$1} END {printf "%.0f", s}')
          echo "MỐC $(date -u +%H:%M:%S) UTC: flutter test xong sau $((T_TEST1 - T_TEST0)) s; Gradle assembleDebug cộng dồn ${GRADLE_S:-0} s (phần còn lại: cài APK và chạy test)"
          # Dòng "Tests: ..." để cloud-test-runner.py phân loại kết quả (flutter test không in dòng này).
          python3 - app-e2e-report/flutter-test.log <<'PY'
          import re, sys
          text = open(sys.argv[1], errors="replace").read()
          rows = re.findall(r"^\d+:\d{2}(?::\d{2})? \+(\d+)(?: ~(\d+))?(?: -(\d+))?:", text, re.M)
          if rows:
              passed, skipped, failed = rows[-1]
              print(f"Tests: {int(passed or 0)} passed, {int(failed or 0)} failed, {int(skipped or 0)} skipped")
          PY
          # Ảnh màn hình cuối và logcat: bằng chứng khi test không lưu ảnh ra đĩa.
          adb exec-out screencap -p > app-e2e-report/emulator-cuoi.png || true
          adb logcat -d -t 3000 > app-e2e-report/logcat.txt || true
          exit "$RC"
          SH
          chmod +x "$RUNNER_TEMP/run-e2e.sh"
          echo "E2E_BOOT_T0=$(date +%s)" >> "$GITHUB_ENV"
          echo "MỐC $(date -u +%H:%M:%S) UTC: trước khi khởi động emulator (bước 13)"

      - name: 13. Chạy integration_test trên emulator Android API 34 (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SPECS: ${{ github.event.inputs.specs }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: bash "$RUNNER_TEMP/run-e2e.sh"

      # Bước 13a: lưu NDK/CMake nếu lượt này chưa có cache và APK đã build xong (NDK đã cài đủ). Chạy cả khi test đỏ.
      # Khóa lấy từ bước 10d (tính TRƯỚC build): build sinh thêm *.gradle* trong app/android nên băm lại ở đây ra khóa khác,
      # cache không bao giờ khớp và lượt nào cũng nén lại NDK ~8,5 phút (run 39121296600: khôi phục c1d57d…, lưu 7490ec…).
      - name: 13a. Lưu NDK và CMake vào cache
        if: always() && steps.ndk-cache.outputs.cache-hit != 'true' && hashFiles('app/build/app/outputs/flutter-apk/app-debug.apk') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.sdk.outputs.dir }}/ndk
            ${{ steps.sdk.outputs.dir }}/cmake
          key: ${{ steps.ndk-cache.outputs.cache-primary-key }}

      # Task 2.1: manifest và resource release không có ngoại lệ cleartext tới 10.0.2.2/localhost.
      # Không dùng flutter build apk --release: compileReleaseJavaWithJavac lỗi vì GeneratedPluginRegistrant
      # tham chiếu integration_test (dev dependency). Gradle merge release không compile Java nên không bị lỗi đó.
      - name: 13b. Kiểm cấu hình mạng bản release (task 2.1)
        if: always()
        working-directory: app
        run: |
          cd android
          [ -f gradlew ] || { echo "::error::Không có gradlew sau build debug"; exit 1; }
          # bash, không phải sh: gradlew là script bash; sh (dash trên ubuntu) lỗi "Syntax error: (" (run 39101569603).
          bash ./gradlew :app:processReleaseManifest :app:mergeReleaseResources --no-daemon --console=plain
          cd ..
          # Module app ghi vào build/app (log run 39108355255: "build/app/outputs/flutter-apk"); plugin ghi vào build/<plugin>/.
          # Chỉ tìm trong build/app/intermediates để không lấy manifest của plugin; android/app/build làm dự phòng.
          MANIFEST=$(find build/app/intermediates android/app/build/intermediates -path '*merged*manifest*release*' -name AndroidManifest.xml 2>/dev/null | head -1)
          if [ -z "$MANIFEST" ]; then echo "::error::Không tìm thấy manifest release đã gộp"; exit 1; fi
          echo "Manifest release: $MANIFEST"
          if ! grep -q 'networkSecurityConfig' "$MANIFEST"; then echo "::error::Manifest release thiếu networkSecurityConfig"; exit 1; fi
          grep -o 'networkSecurityConfig="[^"]*"' "$MANIFEST"
          COUNT=0
          while IFS= read -r f; do
            COUNT=$((COUNT + 1))
            echo "Kiểm resource release: $f"
            if grep -q '10\.0\.2\.2\|localhost' "$f"; then echo "::error::Bản release chứa ngoại lệ debug: $f"; exit 1; fi
          done < <(find build/app/intermediates android/app/build/intermediates -path '*release*' -name 'network_security_config.xml' 2>/dev/null)
          if [ "$COUNT" -eq 0 ]; then echo "::error::Không thấy network_security_config.xml trong resource release"; exit 1; fi
          echo "Task 2.1 OK: $COUNT file network_security_config release, không có 10.0.2.2/localhost."

      # Task 5.2: phân tích tĩnh integration_test. Chạy sau bước test (always) để không chặn emulator; lỗi vẫn làm job đỏ.
      - name: 13c. Phân tích tĩnh integration_test (task 5.2)
        if: always()
        working-directory: app
        run: flutter analyze --no-pub integration_test

      - name: 14. Gom backend.log vào báo cáo (chạy cả khi lỗi)
        if: always()
        run: |
          mkdir -p app/app-e2e-report
          cp "$RUNNER_TEMP/backend.log" app/app-e2e-report/backend.log || echo "Không có backend.log"

      - name: 15. Upload app-e2e-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-report
          path: app/app-e2e-report/
          if-no-files-found: warn

  # ==========================================
  # JOB 5: TEST AICHECKVAR (PYTHON PYTEST)
  # ==========================================
  test-aicheckvar:
    name: 👁️ Test AICheckVAR (PyTest 51 Specs)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'aicheckvar'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout AICheckVAR Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/AICheckVAR
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Requirements & Run PyTest
        run: |
          pip install --upgrade pip
          pip install pytest pyyaml fastapi httpx || true
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt || true; fi
          pytest -v

  # ==========================================
  # JOB 6: TEST AUTO25D-REMOTION (MOTION TESTS)
  # ==========================================
  test-auto25d:
    name: 🎬 Test Auto25D-Remotion (20 Unit Tests)
    if: github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'auto25d'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Auto25D-Remotion Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Auto25D-Remotion
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.custom_branch || 'main' }}

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Run Unit Tests
        run: |
          python -m unittest discover -s tests -v
