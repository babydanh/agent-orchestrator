name: Auto deploy Web main

# Repo Web/Backend (private) khong chay duoc Actions khi het phut, nen push main khong con tu deploy production.
# Workflow nay chay o repo public nay (runner mien phi): cu 60 giay so SHA moi nhat cua main Web va Backend voi cac lan
# deploy.yml da chay; SHA chua deploy thi goi deploy.yml (project=web|backend, env=production) cho dung SHA do.
# Lich cron cua GitHub khong dam bao (tre/bo luot), nen moi lan chay tu lap ~5h30 roi tu goi lai chinh no; cron chi la du phong.
# Chay thu khong deploy (quet mot lan, khong lap): gh workflow run auto-deploy-web.yml -R babydanh/agent-orchestrator -f dry_run=true
run-name: "auto-deploy main${{ inputs.dry_run && ' (dry-run)' || '' }}"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chi in quyet dinh, khong goi deploy'
        type: boolean
        default: false

# Chi mot vong lap chay; ban cho (pending) moi nhat thay ban cho cu, ban nao cung tu lap tiep nen khong mat vong.
concurrency:
  group: auto-deploy-web-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watch:
    name: So main Web/Backend voi lan deploy cuoi
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Quet main, goi deploy production neu co SHA moi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DISPATCH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          scan() {
            # Lan deploy production that (khong dry-run), tru lan bi huy.
            local runs entry project repo sha committed age
            runs="$(gh run list -R "$REPO" --workflow deploy.yml -L 100 --json displayTitle,conclusion --jq \
              '.[] | select(.conclusion != "cancelled") | .displayTitle')" || return 1
            for entry in web:HethongFrontEndWeb_QLgiaidau backend:HethongBackendApi_QuanlyGiaiDau; do
              project="${entry%%:*}"
              repo="$OWNER/${entry#*:}"
              sha="$(gh api "repos/$repo/commits/main" --jq .sha)" || return 1
              committed="$(gh api "repos/$repo/commits/$sha" --jq .commit.committer.date)" || return 1
              # merge-lane.py goi deploy ngay sau khi push; cho 3 phut de khong deploy trung va huy lan dang chay.
              age=$(( $(date +%s) - $(date -d "$committed" +%s) ))
              if (( age < 180 )); then
                echo "SKIP  $project $sha moi $age giay tuoi, cho lan quet sau."
                continue
              fi
              if grep -F "deploy $project production @$sha" <<<"$runs" | grep -vqF "(dry-run)"; then
                continue
              fi
              echo "DEPLOY $project $sha chua deploy production."
              if [[ "$DRY_RUN" == true ]]; then
                echo "dry-run: khong goi deploy."
                continue
              fi
              GH_TOKEN="$DISPATCH_TOKEN" gh workflow run deploy.yml -R "$REPO" \
                -f project="$project" -f env=production -f sha="$sha"
            done
          }

          if [[ "$DRY_RUN" == true ]]; then
            scan
            exit $?
          fi

          # Loi mang/API tam thoi chi bo qua mot luot, khong de vong lap chet.
          deadline=$(( $(date +%s) + 330 * 60 ))
          while (( $(date +%s) < deadline )); do
            scan || echo "WARN  luot quet loi, thu lai sau 60 giay."
            sleep 60
          done

          # Tu goi lai ban ke tiep (cho den khi ban nay ket thuc nho concurrency); workflow_dispatch bang github.token duoc phep.
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run auto-deploy-web.yml -R "$REPO"
