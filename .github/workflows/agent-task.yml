name: OMP Multi-Repo Orchestrator

on:
  issues:
    types: [opened, labeled]

jobs:
  run-agent:
    # Chạy khi issue được mở bởi chính chủ hoặc được gắn nhãn 'agent'
    if: github.event.issue.user.login == github.repository_owner || contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng theo quy định GitHub Actions

    steps:
      - name: 1. Checkout Orchestrator Repo
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 2.1 Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: 2.2 Cài đặt PNPM toàn cục
        run: npm install -g pnpm

      - name: 3. Cài đặt OMP (@oh-my-pi/pi-coding-agent)
        run: |
          npm install -g @oh-my-pi/pi-coding-agent
          omp --version

      - name: 4. Clone các Repositories của dự án
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "OMP Orchestrator Agent"
          git config --global user.email "agent@oh-my-pi.local"

          echo "Cloning Backend repo..."
          git clone https://$GH_PAT@github.com/$OWNER/HethongBackendApi_QuanlyGiaiDau.git backend

          echo "Cloning Frontend App repo..."
          git clone https://$GH_PAT@github.com/$OWNER/HethongFrontEndApp_QLgiaidau.git app

          ls -la

      - name: 5. Đồng bộ cấu hình OMP hoàn chỉnh (Codex + OpenRouter + Jev + 70+ Skills)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          OMP_CODEX_AUTH: ${{ secrets.OMP_CODEX_AUTH }}
        run: |
          mkdir -p ~/.omp/agent

          # Sao chép toàn bộ kho 70+ Skills và Luật Agent từ repo vào ~/.omp/agent
          echo "Copying 70+ Skills and agent directives..."
          cp -r skills ~/.omp/agent/
          cp AGENTS.md ~/.omp/agent/
          cp APPEND_SYSTEM.md ~/.omp/agent/
          cp INSTRUCTIONS.md ~/.omp/agent/

          # Tiêm Codex OAuth vào agent.db nếu có secret OMP_CODEX_AUTH
          if [ -n "$OMP_CODEX_AUTH" ]; then
            echo "Injecting OpenAI Codex OAuth credentials..."
            python3 -c "
          import sqlite3, base64, os
          db_path = os.path.expanduser('~/.omp/agent/agent.db')
          con = sqlite3.connect(db_path)
          con.execute('CREATE TABLE IF NOT EXISTS auth_credentials (id INTEGER PRIMARY KEY AUTOINCREMENT, provider TEXT UNIQUE, credential_type TEXT, data TEXT, disabled_cause TEXT, identity_key TEXT, created_at INTEGER, updated_at INTEGER);')
          raw_data = base64.b64decode(os.environ['OMP_CODEX_AUTH']).decode('utf-8')
          con.execute('INSERT OR REPLACE INTO auth_credentials (id, provider, credential_type, data, created_at, updated_at) VALUES (1, \'openai-codex\', \'oauth\', ?, 1790154256461, 1790154256461);', (raw_data,))
          con.commit()
          print('Codex OAuth injected successfully into agent.db!')
          "
          fi

          # Tạo file config.yml chuẩn khớp 100% với máy local của bạn
          cat << 'EOF' > ~/.omp/agent/config.yml
          setupVersion: 2
          symbolPreset: nerd
          modelRoles:
            default: openai-codex/gpt-6-luna:xhigh
            plan: openai-codex/gpt-6.1-sol
            judge: openrouter/~typesafe/jev-latest:auto
            smol: openrouter/google/gemini-2.5-flash
            task: openrouter/google/gemini-2.5-flash
            vision: openrouter/google/gemini-2.5-flash
            commit: openrouter/google/gemini-2.5-flash
            advisor: openrouter/google/gemini-2.5-flash
          compaction:
            methodOrder:
              - shake
              - soft
            thresholdPercent: 45
            idleEnabled: true
            supersedeReads: true
            dropUseless: true
            pruneToolOutputs: true
          advisor:
            enabled: true
          astGrep:
            enabled: true
          astEdit:
            enabled: true
          retry:
            fallbackChains:
              default:
                - openrouter/google/gemini-2.5-pro
                - openrouter/google/gemini-2.5-flash
              plan:
                - openrouter/google/gemini-2.5-pro
              smol:
                - openrouter/google/gemini-2.5-flash
              task:
                - openrouter/google/gemini-2.5-flash
          providers:
            openrouterVariant: nitro
          EOF

          # Tạo file mcp.json cho OMP
          cat << EOF > ~/.omp/agent/mcp.json
          {
            "mcpServers": {
              "github": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-github"],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "$GH_PAT"
                }
              }
            }
          }
          EOF

      - name: 6. Thực thi nhiệm vụ với OMP Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cd workspace
          BRANCH_NAME="omp/issue-$ISSUE_NUMBER"

          TASK_PROMPT="Nhiệm vụ: $ISSUE_TITLE
          Chi tiết yêu cầu: $ISSUE_BODY

          Ngữ cảnh không gian làm việc:
          - Thư mục 'backend/': Dự án NestJS TypeScript (sử dụng pnpm, test bằng 'pnpm test').
          - Thư mục 'app/': Dự án Flutter Dart (kiểm tra bằng 'flutter test').

          Quy trình bắt buộc:
          1. Đọc và phân tích codebase liên quan đến yêu cầu.
          2. Thực hiện sửa đổi / bổ sung code cần thiết.
          3. Chạy test trong từng thư mục dự án tương ứng. Đảm bảo test pass 100%.
          4. Nếu có sửa đổi ở thư mục nào, hãy 'git checkout -b $BRANCH_NAME' và commit các thay đổi trong thư mục repo đó."

          echo "Executing OMP..."
          omp --prompt "$TASK_PROMPT"

      - name: 7. Đẩy branch và tạo Pull Request cho các Repo có thay đổi
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cd workspace
          BRANCH_NAME="omp/issue-$ISSUE_NUMBER"
          PR_LINKS=""

          # Kiểm tra và đẩy Backend
          if [ -d "backend" ]; then
            cd backend
            if git rev-parse --verify "$BRANCH_NAME" >/dev/null 2>&1; then
              echo "Pushing branch for backend..."
              git push -u https://$GH_PAT@github.com/$OWNER/HethongBackendApi_QuanlyGiaiDau.git "$BRANCH_NAME"
              PR_URL=$(gh pr create --repo "$OWNER/HethongBackendApi_QuanlyGiaiDau" \
                           --head "$BRANCH_NAME" \
                           --base "main" \
                           --title "[OMP] $ISSUE_TITLE (Issue #$ISSUE_NUMBER)" \
                           --body "Pull Request được tạo tự động bởi OMP Orchestrator từ Issue #$ISSUE_NUMBER." || true)
              PR_LINKS="$PR_LINKS\n- Backend PR: $PR_URL"
            fi
            cd ..
          fi

          # Kiểm tra và đẩy Frontend App
          if [ -d "app" ]; then
            cd app
            if git rev-parse --verify "$BRANCH_NAME" >/dev/null 2>&1; then
              echo "Pushing branch for app..."
              git push -u https://$GH_PAT@github.com/$OWNER/HethongFrontEndApp_QLgiaidau.git "$BRANCH_NAME"
              PR_URL=$(gh pr create --repo "$OWNER/HethongFrontEndApp_QLgiaidau" \
                           --head "$BRANCH_NAME" \
                           --base "main" \
                           --title "[OMP] $ISSUE_TITLE (Issue #$ISSUE_NUMBER)" \
                           --body "Pull Request được tạo tự động bởi OMP Orchestrator từ Issue #$ISSUE_NUMBER." || true)
              PR_LINKS="$PR_LINKS\n- Frontend App PR: $PR_URL"
            fi
            cd ..
          fi

          echo "PR_LINKS=$PR_LINKS" >> $GITHUB_ENV

      - name: 8. Phản hồi và tổng kết vào Issue gốc
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "${{ github.repository }}" \
            --body "🎉 **OMP Orchestrator đã hoàn thành nhiệm vụ!**

          Các Pull Request đã được tạo tự động trên các repo tương ứng:
          ${{ env.PR_LINKS }}

          Vui lòng kiểm tra và duyệt merge!"