name: OMP Multi-Repo Orchestrator

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      task_title:
        description: 'Tiêu đề nhiệm vụ (Task Title)'
        required: true
        default: 'Review & Verify Codebase across repos'
      task_body:
        description: 'Chi tiết yêu cầu / Checklist bàn giao'
        required: true
        default: 'Kiểm tra trạng thái build, test và chất lượng mã nguồn backend, app, web.'
      target_branch:
        description: 'Tên branch thực thi (Tùy chọn)'
        required: false
        default: ''

# Mỗi issue chỉ một run tại một thời điểm; lần kích hoạt thêm xếp hàng (không huỷ run đang làm: huỷ là mất việc
# vì bước 7 không chạy). 20/10: relabel 3 lần + mở issue kèm nhãn sinh nhiều run song song cùng nhánh, cùng token.
concurrency:
  group: agent-task-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  run-agent:
    # CHỈ CHÍNH CHỦ (babydanh) MỚI ĐƯỢC PHÉP CHẠY.
    # Issue: chạy khi MỞ issue (nếu chưa gắn nhãn agent-task) hoặc khi GẮN nhãn agent-task (cách chạy lại một issue).
    # Gắn nhãn khác (bug, enhancement...) không còn kích hoạt cả một run mới.
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && (
        (github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'agent-task')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'agent-task')))
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng theo quy định GitHub Actions
    # Cho job e2e: chỉ chạy E2E khi agent tự xong (agent bị cắt/lỗi thì bước 8.6 lo chạy tiếp, E2E phần dở là phí).
    outputs:
      agent_ok: ${{ steps.agent.outcome == 'success' }}
      need_e2e: ${{ steps.e2e-plan.outputs.need }}
      specs: ${{ steps.e2e-plan.outputs.specs }}
      web_ref: ${{ steps.e2e-plan.outputs.web_ref }}
      backend_ref: ${{ steps.e2e-plan.outputs.backend_ref }}
      base_web_ref: ${{ steps.e2e-plan.outputs.base_web_ref }}
      base_backend_ref: ${{ steps.e2e-plan.outputs.base_backend_ref }}

    # CUNG CẤP DATABASE POSTGRESQL & REDIS CHO CHUỖI E2E TEST
    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: tournament_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Orchestrator Repo
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 2.1 Cài đặt Bun (bắt buộc cho OMP runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 2.2 Cài đặt Python 3.12 (bắt buộc cho AST-grep & OMP Python tools)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 2.3 Cài đặt PNPM toàn cục
        run: npm install -g pnpm

      - name: 2.4 Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      # Chromium sẽ chỉ được tải khi thực sự cần chạy Playwright UI Test

      - name: 3. Cài đặt OMP (@oh-my-pi/pi-coding-agent)
        run: |
          npm install -g @oh-my-pi/pi-coding-agent
          omp --version

      - name: 3.1 Cài đặt Ripwire MCP (Code Intelligence)
        continue-on-error: true
        run: |
          echo "Installing Ripwire for Linux x64..."
          RIPWIRE_REPO=redhat-et/ripwire RIPWIRE_INSTALL_YES=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/redhat-et/ripwire/main/scripts/install.sh)" || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ~/.local/bin/ripwire --version || ripwire --version || echo "Ripwire ready or skipped"

      - name: 3.2 Cài đặt codebase-memory MCP (đồ thị code, bản Linux tĩnh)
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh | bash -s -- --skip-config || true
          ~/.local/bin/codebase-memory-mcp --version || echo "codebase-memory chưa cài được, mcp.json sẽ bỏ qua nó"

      - name: 4. Clone các Repositories của dự án
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "OMP Orchestrator Agent"
          git config --global user.email "agent@oh-my-pi.local"
          # Token KHÔNG nằm trong URL: git bỏ token trong URL khi GitHub trả chuyển hướng (#18 "could not read
          # Username"), và agent từng đọc `git remote -v` rồi dừng việc vì thấy token. Credential helper đọc biến môi
          # trường GH_PAT lúc chạy (config không chứa token), CHỈ trả lời cho https://github.com. Đặt trước mọi clone;
          # các bước sau (5, 6, 7, 8.5) dùng chung, miễn bước đó có env GH_PAT.
          git config --global 'credential.https://github.com.helper' '!f() { echo username=x-access-token; echo "password=${GH_PAT}"; }; f'
          clone() {  # clone <tên repo> <thư mục>
            echo "Cloning $1..."
            git clone -q "https://github.com/$OWNER/$1.git" "$2" || echo "$1: không clone được (không có quyền hoặc không tồn tại)"
          }
          clone HethongBackendApi_QuanlyGiaiDau backend
          clone HethongFrontEndApp_QLgiaidau app
          clone HethongFrontEndWeb_QLgiaidau web
          clone AICheckVAR aicheckvar
          clone Auto3Dvideo auto3dvideo
          clone Auto25D-Remotion auto25d-remotion
          ls -la

      - name: 5. Đồng bộ cấu hình OMP hoàn chỉnh (Codex + OpenRouter + luật/skill từ omp-global-config)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          OMP_CODEX_AUTH: ${{ secrets.OMP_CODEX_AUTH }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p ~/.omp/agent

          # Luật + skill lấy thẳng từ repo cấu hình omp của máy (omp-global-config): sửa ở máy là cloud dùng theo,
          # không còn bản chép cũ lệch nhau. Không clone được thì dừng: chạy với luật/skill cũ là sai lặng lẽ.
          # Clone qua credential helper của bước 4 (token không nằm trong URL nên không còn trong .git/config của
          # /tmp/omp-global, agent không đọc được). Token trong URL còn bị git BỎ khi GitHub trả chuyển hướng
          # ("warning: redirecting to ..."): run 39293628190 (#18) chết vì "could not read Username".
          [ -n "$GH_PAT" ] || { echo "::error::Secret GH_PAT rỗng: không clone được ${OWNER}/omp-global-config."; exit 1; }
          for attempt in 1 2 3; do
            git clone -q --depth 1 "https://github.com/${OWNER}/omp-global-config.git" /tmp/omp-global && break
            rm -rf /tmp/omp-global
            [ "$attempt" = 3 ] && { echo "::error::Không clone được ${OWNER}/omp-global-config bằng GH_PAT (cần quyền đọc repo này)."; exit 1; }
            sleep $((attempt * 10))
          done
          cp -r /tmp/omp-global/agent/skills ~/.omp/agent/
          for f in AGENTS.md APPEND_SYSTEM.md INSTRUCTIONS.md ANTI_PATTERNS.md; do
            cp "/tmp/omp-global/agent/$f" ~/.omp/agent/
          done
          echo "Đã đồng bộ $(ls ~/.omp/agent/skills | wc -l) skill + luật từ omp-global-config@$(git -C /tmp/omp-global rev-parse --short HEAD)"
          rm -rf /tmp/omp-global

          # Khởi tạo cơ sở dữ liệu agent.db đầy đủ schema và tiêm Codex OAuth + OpenRouter API key
          echo "Initializing agent.db with schema and credentials..."
          python3 -c "
          import sqlite3, base64, os, json, time

          db_dir = os.path.expanduser('~/.omp/agent')
          os.makedirs(db_dir, exist_ok=True)
          db_path = os.path.join(db_dir, 'agent.db')
          con = sqlite3.connect(db_path)
          cur = con.cursor()

          # Tạo đầy đủ bảng schema OMP yêu cầu
          cur.execute('''CREATE TABLE IF NOT EXISTS schema_version (version INTEGER PRIMARY KEY)''')
          cur.execute('''INSERT OR IGNORE INTO schema_version VALUES (6)''')

          cur.execute('''CREATE TABLE IF NOT EXISTS auth_schema_version (id INTEGER PRIMARY KEY CHECK (id = 1), version INTEGER NOT NULL)''')
          cur.execute('''INSERT OR IGNORE INTO auth_schema_version VALUES (1, 8)''')

          cur.execute('''CREATE TABLE IF NOT EXISTS auth_change_revision (id INTEGER PRIMARY KEY CHECK (id = 1), revision INTEGER NOT NULL)''')
          cur.execute('''INSERT OR IGNORE INTO auth_change_revision VALUES (1, 55824)''')

          cur.execute('''CREATE TABLE IF NOT EXISTS auth_credential_block_mirror_guard (credential_id INTEGER PRIMARY KEY) WITHOUT ROWID''')

          cur.execute('''CREATE TABLE IF NOT EXISTS auth_credential_blocks (
              credential_id INTEGER NOT NULL,
              provider_key TEXT NOT NULL,
              block_scope TEXT NOT NULL DEFAULT '',
              blocked_until_ms INTEGER NOT NULL,
              updated_at INTEGER NOT NULL,
              PRIMARY KEY (credential_id, provider_key, block_scope)
          )''')

          cur.execute('''CREATE TABLE IF NOT EXISTS auth_credentials (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              provider TEXT NOT NULL,
              credential_type TEXT NOT NULL,
              data TEXT NOT NULL,
              disabled_cause TEXT DEFAULT NULL,
              identity_key TEXT DEFAULT NULL,
              created_at INTEGER NOT NULL DEFAULT (CAST(strftime('%s','now') AS INTEGER)),
              updated_at INTEGER NOT NULL DEFAULT (CAST(strftime('%s','now') AS INTEGER))
          )''')

          now_ts = int(time.time())

          # 1. Tiêm OpenRouter API key nếu có
          openrouter_key = os.environ.get('OPENROUTER_API_KEY')
          if openrouter_key:
              data_json = json.dumps({'key': openrouter_key, 'source': 'login'})
              cur.execute('''INSERT OR REPLACE INTO auth_credentials (provider, credential_type, data, created_at, updated_at) VALUES ('openrouter', 'api_key', ?, ?, ?)''', (data_json, now_ts, now_ts))
              print('OpenRouter API key successfully injected into agent.db!')

          # 2. Tiêm Codex OAuth nếu có
          codex_auth = os.environ.get('OMP_CODEX_AUTH')
          if codex_auth:
              try:
                  raw_data = base64.b64decode(codex_auth).decode('utf-8')
                  parsed = json.loads(raw_data)
                  identity_key = f\"email:{parsed.get('email', '')}|org:{parsed.get('orgId', '')}\"
                  cur.execute('''INSERT OR REPLACE INTO auth_credentials (provider, credential_type, data, identity_key, created_at, updated_at) VALUES ('openai-codex', 'oauth', ?, ?, ?, ?)''', (raw_data, identity_key, now_ts, now_ts))
                  print('Codex OAuth credentials successfully injected into agent.db!')
              except Exception as e:
                  print('Warning: Failed to decode/inject Codex OAuth:', e)

          con.commit()
          con.close()
          print('agent.db initialized successfully!')
          "

          # Tạo file config.yml chuẩn khớp 100% với model roles & fallback mới nhất
          cat << 'EOF' > ~/.omp/agent/config.yml
          setupVersion: 2
          symbolPreset: nerd
          modelRoles:
            default: openai-codex/gpt-6-luna:xhigh
            plan: openai-codex/gpt-6.1-sol:high
            judge: openrouter/poolside/laguna-s-2.1:free
            smol: openrouter/poolside/laguna-s-2.1:free
            # Subagent viết code dùng cùng model với agent chính (gói Codex): code viết trên cloud không kém ở máy.
            task: openai-codex/gpt-6-luna:high
            # Không có model nhìn ảnh miễn phí đã kiểm chứng trên OpenRouter: dùng Codex (gói tháng, không tốn tiền OpenRouter).
            vision: openai-codex/gpt-6-luna:high
            commit: openrouter/poolside/laguna-s-2.1:free
            advisor: openrouter/poolside/laguna-s-2.1:free
            slow: openrouter/poolside/laguna-s-2.1:free
            tiny: openrouter/poolside/laguna-s-2.1:free
            memory: openrouter/poolside/laguna-s-2.1:free
            # Bỏ vai image (ming-image trả phí, không có bản miễn phí): agent trên cloud không tạo ảnh.
          compaction:
            methodOrder:
              - shake
              - soft
            thresholdPercent: 75
            keepRecentTokens: 16000
            idleEnabled: false
            supersedeReads: false
            dropUseless: false
            pruneToolOutputs: false
          advisor:
            enabled: true
          prewalk:
            enabled: false
          promptCaching:
            enabled: true
            strategy: static-head
          tools:
            artifactSpillThreshold: 30
            speculativeExecution:
              enabled: true
              maxInFlight: 2
          astGrep:
            enabled: true
          astEdit:
            enabled: true
          retry:
            # Bật dự phòng: Laguna free hết hạn mức ngày (dùng chung khóa OpenRouter với máy) thì chuyển sang model khác
            # thay vì lỗi 429 làm hỏng subagent. Codex (gói tháng) là nấc cuối.
            modelFallback: true
            fallbackChains:
              "openai-codex/*":
                - openrouter/poolside/laguna-s-2.1:free
                - openrouter/nvidia/nemotron-3.5-lightning:free
              default:
                - openrouter/poolside/laguna-s-2.1:free
              plan:
                - openai-codex/gpt-6-luna:high
              smol:
                - openrouter/nvidia/nemotron-3.5-lightning:free
                - openai-codex/gpt-6-luna:high
              task:
                - openrouter/poolside/laguna-s-2.1:free
              judge:
                - openrouter/nvidia/nemotron-3.5-lightning:free
                - openai-codex/gpt-6-luna:high
              commit:
                - openrouter/nvidia/nemotron-3.5-lightning:free
                - openai-codex/gpt-6-luna:high
              tiny:
                - openrouter/nvidia/nemotron-3.5-lightning:free
                - openai-codex/gpt-6-luna:high
              memory:
                - openrouter/nvidia/nemotron-3.5-lightning:free
                - openai-codex/gpt-6-luna:high
              advisor:
                - openrouter/nvidia/nemotron-3.5-lightning:free
                - openai-codex/gpt-6-luna:high
              slow:
                - openrouter/nvidia/nemotron-3.5-lightning:free
                - openai-codex/gpt-6-luna:high
          providers:
            openrouterVariant: nitro
            cacheWarming: idle
            cacheRetention: long
          EOF

          # Tạo mcp.json bằng Python để JSON luôn hợp lệ (bản heredoc cũ thiếu 2 dấu "}" nên omp không nạp MCP nào).
          # Chỉ khai báo server có lệnh trên runner: bước cài lỗi thì bỏ server đó thay vì để omp lỗi khi gọi.
          PATH="$HOME/.local/bin:$PATH" python3 - <<'PY'
          import json, os, shutil
          servers = {
              "github": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-github"],
                         "env": {"GITHUB_PERSONAL_ACCESS_TOKEN": os.environ.get("GH_PAT", "")}},
              "ripwire": {"command": "ripwire", "args": ["--mcp", "--top-k=150", "--max-file-size=2M",
                          "--exclude=node_modules", "--exclude=.git", "--exclude=.next", "--exclude=.dart_tool",
                          "--exclude=coverage", "--exclude=.cache"]},
              "codebase-memory": {"command": "codebase-memory-mcp"},
          }
          found = {name: s for name, s in servers.items() if shutil.which(s["command"])}
          for name in sorted(set(servers) - set(found)):
              print(f"::warning::MCP {name}: không thấy lệnh {servers[name]['command']}, bỏ qua")
          path = os.path.expanduser("~/.omp/agent/mcp.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump({"mcpServers": found}, f, indent=2)
          json.load(open(path, encoding="utf-8"))  # đọc lại: lỗi thì bước này đỏ ngay
          print("mcp.json: " + ", ".join(sorted(found)))
          PY

      - name: 6. Thực thi nhiệm vụ với OMP Agent (Headless Non-interactive Mode)
        id: agent
        # Chừa ~45 phút trong 360 phút của job cho bước 7 (đẩy code) + báo cáo: agent chạy quá giờ thì bước này hỏng,
        # còn job vẫn sống để đẩy phần đã làm, rồi bước 8.6 tự chạy tiếp. Nhãn `thu-noi-tiep` chỉ để thử chuỗi nối
        # tiếp: cắt agent sau 8 phút (đủ kiểm khoá Codex, khởi động omp, làm một việc nhỏ) thay vì chờ 5 tiếng.
        timeout-minutes: ${{ contains(github.event.issue.labels.*.name, 'thu-noi-tiep') && 8 || 300 }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Chỉ dùng cho fetch nhánh handoff ở đầu bước (credential helper bước 4 đọc biến này); unset trước khi gọi omp.
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.inputs.task_title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.inputs.task_body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.run_number }}
          MANUAL_BRANCH: ${{ github.event.inputs.target_branch }}
          # Chỉ để đếm lượt nối tiếp (đọc bình luận issue); unset trước khi gọi omp, như GH_PAT.
          GH_TOKEN: ${{ github.token }}
        run: |
          cd workspace
          BRANCH_NAME="omp/issue-$ISSUE_NUMBER"
          if [ -n "$MANUAL_BRANCH" ]; then
            BRANCH_NAME="$MANUAL_BRANCH"
          fi

          # Kiểm tra xem Issue có phải là Handoff từ local hay không
          HANDOFF_BRANCH=$(echo "$ISSUE_BODY" | grep -oP 'Branch dở dang\*\*:\s*`?\K[^`\s]+' | head -n 1 || true)
          if [ -n "$HANDOFF_BRANCH" ]; then
            echo "Phát hiện Handoff Branch: $HANDOFF_BRANCH"
            for repo_dir in backend app web aicheckvar auto3dvideo auto25d-remotion; do
              if [ -d "$repo_dir" ]; then
                cd "$repo_dir"
                echo "Đang đồng bộ branch $HANDOFF_BRANCH cho $repo_dir..."
                git fetch origin "$HANDOFF_BRANCH":"$HANDOFF_BRANCH" 2>/dev/null && git checkout "$HANDOFF_BRANCH" && git pull origin "$HANDOFF_BRANCH" 2>/dev/null || true
                cd ..
              fi
            done
            BRANCH_NAME="$HANDOFF_BRANCH"
          fi

          # Lượt nối tiếp (bước 8.6 gắn lại nhãn agent-task khi lượt trước bị cắt/lỗi giữa chừng): số lượt = số bình luận
          # mang dấu omp-auto-continue. Nhánh đã có trên origin thì làm tiếp trên đó, không bắt đầu lại từ main
          # (lệnh `git checkout -B` trong prompt giữ nguyên HEAD khi đang đứng trên đúng nhánh).
          CONTINUE_ROUND=0
          if [ "$EVENT_NAME" = "issues" ]; then
            # Đọc hỏng (mạng, API) thì coi như lượt đầu: bash của Actions chạy -e -o pipefail, không được làm hỏng bước 6.
            CONTINUE_ROUND=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
              --jq '[.[] | select(.body | contains("<!-- omp-auto-continue -->"))] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}') \
              || CONTINUE_ROUND=0
          fi
          echo "Lượt nối tiếp: $CONTINUE_ROUND"
          # Nhánh nền (`**Branch nền**:`, `**Nhánh nền**:`, `**Branch dở dang (nền)**:`): việc làm trên nhánh RIÊNG tách từ
          # nhánh nền, không đẩy thẳng vào nhánh nền. Khác `**Branch dở dang**:` (fast-handoff) là làm tiếp chính nhánh đó.
          # Trước 27/10 dạng có "(nền)" không được nhận: #54–56 tách nhánh từ main, thiếu phần việc của nhánh nền.
          BASE_BRANCH=""
          if [ -z "$HANDOFF_BRANCH" ]; then
            BASE_BRANCH=$(printf '%s\n' "$ISSUE_BODY" | grep -oP '(?:Branch|Nhánh)(?: dở dang)? \(?nền\)?\*\*:\s*`?\K[^`\s]+' | head -n 1 || true)
            on_task=0
            on_base=0
            for repo_dir in backend app web aicheckvar auto3dvideo auto25d-remotion; do
              [ -d "$repo_dir/.git" ] || continue
              if git -C "$repo_dir" ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
                git -C "$repo_dir" fetch -q origin "$BRANCH_NAME:$BRANCH_NAME" && git -C "$repo_dir" checkout -q "$BRANCH_NAME" \
                  && echo "$repo_dir: làm tiếp trên nhánh $BRANCH_NAME đã có" && on_task=$((on_task + 1))
              elif [ -n "$BASE_BRANCH" ] && git -C "$repo_dir" ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null 2>&1; then
                git -C "$repo_dir" fetch -q origin "$BASE_BRANCH:$BASE_BRANCH" && git -C "$repo_dir" checkout -q "$BASE_BRANCH" \
                  && echo "$repo_dir: tách nhánh $BRANCH_NAME từ nhánh nền $BASE_BRANCH" && on_base=$((on_base + 1))
              fi
            done
            # Ghi nhánh nền mà không repo nào có (gõ sai, chưa push): dừng, không lặng lẽ tách từ main như #54–56.
            # Repo không có nhánh nền nhưng repo khác có thì repo đó vẫn tách từ main (repo không liên quan tới việc).
            if [ -n "$BASE_BRANCH" ] && [ "$on_task" = 0 ] && [ "$on_base" = 0 ]; then
              echo "::error::Issue ghi nhánh nền '$BASE_BRANCH' nhưng không repo nào có nhánh này trên origin: dừng, không tách nhánh từ main."
              exit 1
            fi
          fi
          # Đầu nhánh trước khi agent chạy: bước 8.6 so với sau bước 7 để biết lượt này có tiến triển không.
          echo "AGENT_BRANCH=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "BASE_BRANCH=$BASE_BRANCH" >> "$GITHUB_ENV"
          for repo_dir in backend app web aicheckvar auto3dvideo auto25d-remotion; do
            [ -d "$repo_dir/.git" ] || continue
            echo "$repo_dir $(git -C "$repo_dir" rev-parse -q --verify "refs/heads/$BRANCH_NAME" || echo none)"
          done > "$RUNNER_TEMP/heads-before.txt"

          TASK_PROMPT="Nhiệm vụ: $ISSUE_TITLE
          Chi tiết bàn giao / yêu cầu:
          $ISSUE_BODY

          Ngữ cảnh không gian làm việc (workspace):
          - Thư mục 'backend/': Dự án NestJS TypeScript (sử dụng pnpm, test bằng 'pnpm test').
          - Thư mục 'app/': Dự án Flutter Dart (kiểm tra bằng 'flutter test').
          - Thư mục 'web/': Dự án Next.js React TypeScript (sử dụng pnpm; e2e chỉ chạy đúng file liên quan: 'pnpm test:e2e test/e2e/<file>.spec.ts', KHÔNG chạy cả bộ trừ khi issue ghi 'E2E: toàn bộ'; hoặc 'pnpm build').
          - Thư mục 'aicheckvar/': Dự án Python Computer Vision AI (kiểm tra bằng 'pytest').
          - Thư mục 'auto3dvideo/': Dự án Auto 3D Video Tauri / Python.
          - Thư mục 'auto25d-remotion/': Dự án Remotion Video Motion Design (kiểm tra bằng 'python -m unittest discover -s tests').

          Quy trình bắt buộc (Tuân thủ nghiêm ngặt Điều luật 16 Regression-Guard):
          1. Di chuyển vào đúng thư mục dự án liên quan (backend, app hoặc web).
          2. Tạo hoặc chuyển sang branch '$BRANCH_NAME' bằng lệnh: git checkout -B $BRANCH_NAME
             Nếu bạn làm trong git worktree (quy trình AGENTS.md), worktree đó phải ở nhánh '$BRANCH_NAME' và commit hết vào nhánh này. KHÔNG push và KHÔNG merge main: bước sau của workflow tự push nhánh '$BRANCH_NAME' (kể cả việc còn trong worktree).
          3. ĐỌC TEST CŨ TRƯỚC: Mở và khảo sát toàn bộ các file test cũ (trong test/e2e/, tests/, *_test.dart) để nắm rõ UI selector và assertions, đảm bảo không phá vỡ logic cũ.
          4. Đọc kỹ mục 'Các việc CẦN LÀM TIẾP (Pending Checklist)' trong yêu cầu trên và hoàn thành toàn bộ.
          5. CHẠY TEST THẬT & ALLURE: Chạy đúng test liên quan tới việc này (Web: 'pnpm test:e2e <các spec trong trường E2E specs của issue hoặc spec bạn vừa thêm/sửa>'; Backend: 'pnpm test'; App: 'flutter test <file>') để đảm bảo tính năng mới chạy chuẩn và test liên quan vẫn pass. Spec mới viết cho việc này đặt trong test/e2e/ để bước E2E tự động chạy lại.
          6. BẮT BUỘC stage và commit tất cả thay đổi: git add . && git commit -m 'feat: complete handoff tasks for $ISSUE_TITLE' trên branch '$BRANCH_NAME'."

          # Lượt sửa so thay đổi của việc với nhánh nền nếu có (repo không có nhánh nền thì so với main).
          DIFF_FROM="origin/${BASE_BRANCH:-main}"
          DIFF_NOTE=""
          if [ -n "$BASE_BRANCH" ]; then DIFF_NOTE=" (repo nào không có nhánh $BASE_BRANCH thì dùng origin/main)"; fi
          if [ "$CONTINUE_ROUND" -gt 0 ]; then
            # Lượt do job e2e gọi: bình luận dấu cuối có e2e-run:<id> (và e2e-base:<id> nếu đã chạy lại trên nhánh nền).
            # Tên test đỏ và lỗi đọc thẳng từ log run E2E (không chép vào issue công khai). Đọc bằng GH_PAT, trước khi unset.
            LAST_MARK=$(GH_TOKEN="$GH_PAT" gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
              --jq '[.[] | select(.body | contains("<!-- omp-auto-continue -->")) | .body] | last // ""' 2>/dev/null) || LAST_MARK=""
            E2E_RUN=$(printf '%s' "$LAST_MARK" | grep -oE 'e2e-run:[0-9]+' | tail -n 1 | cut -d: -f2 || true)
            E2E_BASE=$(printf '%s' "$LAST_MARK" | grep -oE 'e2e-base:[0-9]+' | tail -n 1 | cut -d: -f2 || true)
            if [ -n "$E2E_RUN" ]; then
              E2E_LOG=$(GH_TOKEN="$GH_PAT" gh run view "$E2E_RUN" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null | sed -E 's/^[^\t]*\t[^\t]*\t[0-9TZ:.-]+ //') || E2E_LOG=""
              E2E_FAILED=$(printf '%s\n' "$E2E_LOG" | grep -a -oE '✘ +[0-9]+ \[[a-z]+\] › [^(]+' | sed -E 's/^✘ +[0-9]+ //; s/ +$//' | sort -u || true)
              # Test cũng đỏ trên nhánh nền (job e2e đã chạy lại đúng spec đó) là lỗi có sẵn: không đưa cho agent sửa.
              # So không kèm dòng:cột, như scripts/agent/e2e-run.sh.
              if [ -n "$E2E_BASE" ]; then
                BASE_FAILED=$(GH_TOKEN="$GH_PAT" gh run view "$E2E_BASE" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null \
                  | grep -a -oE '✘ +[0-9]+ \[[a-z]+\] › [^(]+' \
                  | sed -E 's/^✘ +[0-9]+ //; s/(\.spec\.ts):[0-9]+:[0-9]+/\1/; s/ +$//' | sort -u) || BASE_FAILED=""
                E2E_FAILED=$(printf '%s\n' "$E2E_FAILED" | while IFS= read -r t; do
                  [ -n "$t" ] || continue
                  key=$(printf '%s' "$t" | sed -E 's/(\.spec\.ts):[0-9]+:[0-9]+/\1/')
                  printf '%s\n' "$BASE_FAILED" | grep -qxF -- "$key" || printf '%s\n' "$t"
                done)
              fi
              E2E_FAILED=$(printf '%s\n' "$E2E_FAILED" | head -n 20)
              E2E_ERRORS=$(printf '%s\n' "$E2E_LOG" | grep -a -A 14 -E '^ +[0-9]+\) \[[a-z]+\] ›' | head -n 150 || true)
              # Chỉ in số đếm (log công khai): để biết lượt sửa có nhận được ngữ cảnh E2E thật không.
              echo "Lượt sửa E2E: run $E2E_RUN (nền: ${E2E_BASE:-không chạy}), $(printf '%s' "$E2E_FAILED" | grep -c . ) test đỏ mới, $(printf '%s' "$E2E_ERRORS" | grep -c . ) dòng lỗi đưa vào đề"
              TASK_PROMPT="$TASK_PROMPT

          LƯỢT SỬA E2E $CONTINUE_ROUND: phần việc đã được đẩy lên nhánh '$BRANCH_NAME' (bạn đang đứng trên nhánh đó), nhưng E2E chạy trên nhánh này (run test-runner $E2E_RUN) có test đỏ do việc này gây ra (test cũng đỏ trên nhánh nền/main đã được bỏ khỏi danh sách):
          $E2E_FAILED

          Lỗi Playwright (có thể in cả lỗi của test có sẵn đã bỏ ở trên, bỏ qua chúng):
          $E2E_ERRORS

          Việc của lượt này: xem 'git diff --stat $DIFF_FROM...HEAD'$DIFF_NOTE để biết nhánh đã sửa gì, rồi sửa để các test trên xanh. Nếu một test đỏ KHÔNG liên quan tới phần nhánh này sửa (màn hình/API test dùng không bị đụng), đó là lỗi có sẵn: KHÔNG sửa, ghi rõ trong báo cáo cuối. Không xoá, không bỏ qua (skip) test để cho xanh."
            else
              TASK_PROMPT="$TASK_PROMPT

          LƯỢT NỐI TIẾP $CONTINUE_ROUND: lượt trước bị dừng giữa chừng (quá giờ hoặc lỗi) và phần làm dở đã được đẩy lên nhánh '$BRANCH_NAME'; bạn đang đứng trên nhánh đó. Trước khi làm: trong từng repo có nhánh này, xem 'git log --oneline $DIFF_FROM..HEAD' và 'git diff --stat $DIFF_FROM...HEAD'$DIFF_NOTE để biết đã làm gì. Chỉ làm tiếp phần còn thiếu: không làm lại từ đầu, không xoá hay viết lại phần đã có trừ khi nó sai."
            fi
          fi
          # Kiểm tra và khôi phục session dở dang nếu có từ branch omp-sync/sessions
          SESSION_ID=$(echo "$ISSUE_BODY" | grep -oP 'Session-ID\*\*:\s*`?\K[^`\s]+' | head -n 1 || true)
          # Lượt nối tiếp: phiên mới nhất là phiên lượt trước, bước 8.5 lưu ở thư mục issue-<số>.
          if [ "$CONTINUE_ROUND" -gt 0 ]; then SESSION_ID="issue-$ISSUE_NUMBER"; fi
          TARGET_REPO=$(echo "$ISSUE_BODY" | grep -oP 'Repo mục tiêu\*\*:\s*`?\K[^`\s]+' | head -n 1 || true)
          
          # Tự động nhảy vào đúng repo mục tiêu nếu có
          EXEC_DIR="."
          if [ "$TARGET_REPO" = "HethongBackendApi_QuanlyGiaiDau" ] && [ -d "backend" ]; then
            EXEC_DIR="backend"
          elif [ "$TARGET_REPO" = "HethongFrontEndApp_QLgiaidau" ] && [ -d "app" ]; then
            EXEC_DIR="app"
          elif [ "$TARGET_REPO" = "HethongFrontEndWeb_QLgiaidau" ] && [ -d "web" ]; then
            EXEC_DIR="web"
          elif [ "$TARGET_REPO" = "AICheckVAR" ] && [ -d "aicheckvar" ]; then
            EXEC_DIR="aicheckvar"
          elif [ "$TARGET_REPO" = "Auto3Dvideo" ] && [ -d "auto3dvideo" ]; then
            EXEC_DIR="auto3dvideo"
          elif [ "$TARGET_REPO" = "Auto25D-Remotion" ] && [ -d "auto25d-remotion" ]; then
            EXEC_DIR="auto25d-remotion"
          fi
          echo "Thư mục thực thi chính: $EXEC_DIR"

          if [ -n "$SESSION_ID" ]; then
            echo "Phát hiện Handoff Session ID: $SESSION_ID. Đang tải từ branch omp-sync/sessions..."
            mkdir -p /tmp/sync_sessions
            # Phiên lưu ở repo PRIVATE omp-sessions (từ 2026-10-23): log phiên chứa nguyên văn code repo private.
            git clone --branch omp-sync/sessions --depth 1 "https://github.com/${{ github.repository_owner }}/omp-sessions.git" /tmp/sync_sessions || true
            if [ -d "/tmp/sync_sessions/$SESSION_ID" ]; then
              echo "Khôi phục phiên làm việc $SESSION_ID vào ~/.omp/agent/sessions/..."
              mkdir -p ~/.omp/agent/sessions
              cp -r /tmp/sync_sessions/$SESSION_ID/* ~/.omp/agent/sessions/ 2>/dev/null || true
            fi
          fi

          # Kiểm khóa Codex trước khi giao việc: lần 16/10 khóa hỏng nên agent âm thầm chạy cả việc bằng model khác.
          # --mode json để thấy model thật sự trả lời; có errorMessage nghĩa là Codex lỗi và đã bị chuyển dự phòng.
          printf 'Trả lời đúng chữ OK.\n' | omp -p --mode json --no-session --tools=read --model openai-codex/gpt-6-luna > /tmp/codex_check.json 2>&1 || true
          if grep -q '"errorMessage"' /tmp/codex_check.json || ! grep -q '"model":"gpt-6-luna"' /tmp/codex_check.json; then
            echo "::error::Khóa Codex (secret OMP_CODEX_AUTH) không dùng được. Ở máy chạy: powershell ~/.omp/scripts/sync-codex-token.ps1"
            # Lỗi thật của Codex (trước chỉ in 5 dòng cuối, là lỗi của model dự phòng nên không biết vì sao Codex hỏng).
            grep -o '"errorMessage":"[^"]*"' /tmp/codex_check.json | sort -u | head -5 | cut -c1-300
            grep -v '^\s*$' /tmp/codex_check.json | tail -3 | cut -c1-300
            exit 1
          fi
          echo "Khóa Codex hoạt động."

          # Agent không cần token: push do bước 7 làm. Không để shell của agent đọc được GH_PAT/GH_TOKEN.
          unset GH_PAT GH_TOKEN
          echo "Executing OMP in Headless Mode inside $EXEC_DIR..."
          cd "$EXEC_DIR"
          if [ -n "$SESSION_ID" ]; then
            printf "%s\n" "$TASK_PROMPT" | omp --continue -p || printf "%s\n" "$TASK_PROMPT" | omp -p
          else
            printf "%s\n" "$TASK_PROMPT" | omp -p
          fi
          cd - >/dev/null
      - name: 7. Tự động đẩy code thẳng vào nhánh thực thi & Kích hoạt Test
        # Chạy cả khi bước 6 hỏng/quá giờ: phần agent đã làm vẫn được đẩy (bị huỷ tay thì thôi).
        if: ${{ !cancelled() }}
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.run_number }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.inputs.task_title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.inputs.task_body }}
          MANUAL_BRANCH: ${{ github.event.inputs.target_branch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cd workspace
          BRANCH_NAME="omp/issue-$ISSUE_NUMBER"
          if [ -n "$MANUAL_BRANCH" ]; then
            BRANCH_NAME="$MANUAL_BRANCH"
          fi
          HANDOFF_BRANCH=$(echo "$ISSUE_BODY" | grep -oP 'Branch dở dang\*\*:\s*`?\K[^`\s]+' | head -n 1 || true)
          if [ -n "$HANDOFF_BRANCH" ]; then
            BRANCH_NAME="$HANDOFF_BRANCH"
          fi
          # Gom việc ở thư mục clone + mọi git worktree, gộp commit mới trên origin trong lúc agent chạy (không force,
          # xung đột thì đẩy sang nhánh riêng), báo số file khác main. Có test: scripts/agent/test_push_work.py.
          RUN_ID="${{ github.run_id }}" bash "$GITHUB_WORKSPACE/scripts/agent/push-work.sh" "$BRANCH_NAME" \
            backend app web aicheckvar auto3dvideo auto25d-remotion

      - name: 7.1 Tải lên bản sao việc dở không commit được (agent-recover)
        # Ngay sau bước 7, TRƯỚC E2E: E2E dùng hết thời gian còn lại thì job bị huỷ, bước tải sau đó không chạy.
        # push-work.sh chép file dở vào đây khi commit hỏng cả khi bỏ qua hook; không có thì bỏ qua.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-recover
          path: ${{ runner.temp }}/agent-recover
          if-no-files-found: ignore
          retention-days: 30

      - name: 7.2 Chọn spec E2E cho job e2e (chạy bằng test-runner.yml, không dựng ở đây)
        # Trước 25/10 bước này tự dựng Backend + Web rồi chạy Playwright trong job agent: bản chép lệch test-runner.yml
        # (chờ sai cổng, sai bản Chromium) nên 10/11 run hỏng ở đây. Giờ chỉ quyết định chạy spec nào; job `e2e` gọi
        # test-runner.yml (bộ dựng đang xanh: cache DB, tài khoản E2E) và E2E đỏ thì gọi agent sửa tiếp.
        id: e2e-plan
        if: ${{ !cancelled() }}
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.inputs.task_title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.inputs.task_body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.run_number }}
          MANUAL_BRANCH: ${{ github.event.inputs.target_branch }}
          # ls-remote repo riêng đi qua credential helper của bước 4 (đọc GH_PAT).
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          # Cùng nhánh bước 6/7 đã dùng.
          BRANCH_NAME="omp/issue-$ISSUE_NUMBER"
          if [ -n "$MANUAL_BRANCH" ]; then BRANCH_NAME="$MANUAL_BRANCH"; fi
          HANDOFF_BRANCH=$(printf '%s\n' "$ISSUE_BODY" | grep -oP 'Branch dở dang\*\*:\s*`?\K[^`\s]+' | head -n 1 || true)
          if [ -n "$HANDOFF_BRANCH" ]; then BRANCH_NAME="$HANDOFF_BRANCH"; fi
          NEED_E2E=false
          # Bước 6 ghi BASE_BRANCH vào GITHUB_ENV: việc tách từ nhánh nền thì "thay đổi của việc" tính so với nhánh nền.
          DIFF_BASE=main
          if [ -n "${BASE_BRANCH:-}" ] && git -C web rev-parse --verify -q "$BASE_BRANCH" >/dev/null 2>&1; then DIFF_BASE="$BASE_BRANCH"; fi
          TARGET_REPO=$(echo "$ISSUE_BODY" | grep -oP 'Repo mục tiêu\*\*:\s*`?\K[^`\s]+' | head -n 1 || true)

          # 1. Kiểm tra nếu Task nhắm vào Frontend Web
          if [ "$TARGET_REPO" = "HethongFrontEndWeb_QLgiaidau" ]; then
            echo ">>> Phát hiện Repo mục tiêu là Web -> Kích hoạt E2E!"
            NEED_E2E=true
          fi

          # 2. Kiểm tra nếu nội dung hoặc tiêu đề có từ khóa về UI / E2E / Playwright
          if echo "$ISSUE_TITLE $ISSUE_BODY" | grep -iqE 'e2e|playwright|test web|giao diện|ui test|allure'; then
            echo ">>> Phát hiện yêu cầu kiểm thử Web/UI qua tiêu đề hoặc checklist -> Kích hoạt E2E!"
            NEED_E2E=true
          fi

          # 3. Kiểm tra nếu có thay đổi code trong thư mục web/
          if [ -d "web" ]; then
            cd web
            if [ -n "$BRANCH_NAME" ] && git rev-parse --verify "$BRANCH_NAME" >/dev/null 2>&1; then
              if ! git diff --quiet "$DIFF_BASE".."$BRANCH_NAME" 2>/dev/null; then
                echo ">>> Phát hiện có commit thay đổi trong repo Web -> Kích hoạt E2E!"
                NEED_E2E=true
              fi
            fi
            cd ..
          fi

          # NẾU KHÔNG CẦN TEST WEB UI: BỎ QUA ĐỂ TIẾT KIỆM THỜI GIAN & TÀI NGUYÊN
          if [ "$NEED_E2E" != "true" ]; then
            echo ">>> [SKIP] Nhiệm vụ này KHÔNG liên quan đến Web UI / Playwright."
            exit 0
          fi

          # CHỈ CHẠY E2E MÀ VIỆC NÀY YÊU CẦU (không chạy cả bộ ~55 phút cho mọi issue):
          #  1) các file test/e2e/*.spec.ts ghi trong tiêu đề/nội dung issue (trường "E2E specs" của fast-handoff),
          #  2) nếu issue không ghi: các spec nhánh này thêm/sửa so với main (hoặc nhánh nền),
          #  3) cả bộ CHỈ khi issue ghi rõ "E2E: toàn bộ" / "E2E: full".
          FULL_E2E=false
          # Chỉ khi một DÒNG kết thúc bằng "E2E: toàn bộ" / "E2E specs: toàn bộ" (hoặc full); cụm nằm giữa câu không tính.
          if printf '%s\n' "$ISSUE_BODY" | grep -iqE 'E2E( specs)?\**:[[:space:]]*(toàn bộ|full)[[:space:]]*$'; then FULL_E2E=true; fi
          SPECS=$(printf '%s\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" | grep -oE 'test/e2e/[A-Za-z0-9_./-]+\.spec\.ts' | sort -u | tr '\n' ' ' || true)
          if [ -z "$SPECS" ] && [ -d web ] && [ -n "$BRANCH_NAME" ] && git -C web rev-parse --verify "$BRANCH_NAME" >/dev/null 2>&1; then
            SPECS=$(git -C web diff --name-only --diff-filter=AM "$DIFF_BASE".."$BRANCH_NAME" -- 'test/e2e/*.spec.ts' | tr '\n' ' ' || true)
          fi
          # Bỏ spec không có trong repo Web (Playwright sẽ báo "No tests found").
          KEPT=""
          for s in $SPECS; do
            if [ -f "web/$s" ]; then KEPT="$KEPT $s"; else echo ">>> Bỏ qua spec không tồn tại: $s"; fi
          done
          SPECS="${KEPT# }"
          if [ "$FULL_E2E" = "true" ]; then
            SPECS=""
            echo ">>> E2E: issue yêu cầu chạy TOÀN BỘ bộ Playwright."
          elif [ -z "$SPECS" ]; then
            echo "=========================================================="
            echo ">>> [SKIP E2E] Issue không nêu spec nào (test/e2e/<file>.spec.ts) và nhánh không thêm/sửa spec."
            echo ">>> Ghi spec cần chạy vào issue (trường 'E2E specs'), hoặc 'E2E: toàn bộ' để chạy cả bộ."
            echo "=========================================================="
            exit 0
          else
            echo ">>> E2E chỉ chạy: $SPECS"
          fi

          # Repo có nhánh của việc thì dùng nhánh đó; không có thì dùng nhánh nền nếu repo có, còn lại main (test-runner
          # fetch ref không có là hỏng). base_*_ref: nhánh nền tương ứng, job e2e chạy lại test đỏ trên đó để tách lỗi có sẵn.
          has_ref() { git -C "$1" ls-remote --exit-code --heads origin "$2" >/dev/null 2>&1; }
          base_ref_of() { [ -d "$1" ] && [ -n "${BASE_BRANCH:-}" ] && has_ref "$1" "$BASE_BRANCH" && echo "$BASE_BRANCH" || true; }
          ref_of() { [ -d "$1" ] && has_ref "$1" "$BRANCH_NAME" && echo "$BRANCH_NAME" || base_ref_of "$1"; }
          WEB_REF=$(ref_of web)
          BACKEND_REF=$(ref_of backend)
          BASE_WEB_REF=$(base_ref_of web)
          BASE_BACKEND_REF=$(base_ref_of backend)
          {
            echo "need=true"
            echo "specs=$SPECS"
            echo "web_ref=$WEB_REF"
            echo "backend_ref=$BACKEND_REF"
            echo "base_web_ref=$BASE_WEB_REF"
            echo "base_backend_ref=$BASE_BACKEND_REF"
          } >> "$GITHUB_OUTPUT"
          echo ">>> E2E sẽ chạy ở job e2e (test-runner.yml), web_ref=${WEB_REF:-main} backend_ref=${BACKEND_REF:-main}" \
            "(nền: web=${BASE_WEB_REF:-main} backend=${BASE_BACKEND_REF:-main})"

      # Repo này public: không upload allure-report/playwright-report (ảnh, video, trace chứa giao diện,
      # request/response của repo private). Chỉ in số test theo trạng thái; xem chi tiết thì chạy lại ở máy.
      - name: 7.5 Tổng kết E2E (không đăng báo cáo)
        if: always()
        run: |
          d=workspace/web/allure-results
          if [ -d "$d" ] && ls "$d"/*-result.json >/dev/null 2>&1; then
            echo "E2E theo trạng thái: $(jq -r '.status' "$d"/*-result.json | sort | uniq -c | tr -s ' \n' ' ')"
          else
            echo "E2E: không có kết quả"
          fi

      - name: 8. Phản hồi và tổng kết vào Issue gốc (nếu kích hoạt từ Issue)
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          # Job e2e chạy SAU job này: còn E2E thì chưa được nói "xanh" (issue #52: báo xanh rồi 7 phút sau E2E đỏ).
          E2E_PENDING: ${{ steps.agent.outcome == 'success' && steps.e2e-plan.outputs.need == 'true' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ] && [ "$E2E_PENDING" = "true" ]; then
            HEADLINE="Agent đã xong, code đã đẩy. E2E ĐANG CHẠY: kết quả sẽ có trong bình luận tiếp theo, chưa dùng code vội."
          elif [ "$JOB_STATUS" = "success" ]; then
            HEADLINE="Run hoàn tất, các step đều xanh (việc này không cần E2E)."
          else
            HEADLINE="Run KẾT THÚC VỚI TRẠNG THÁI: $JOB_STATUS. Có step bị lỗi, xem log trước khi dùng code."
          fi
          # PUSHED_REPOS (bước 7 ghi vào GITHUB_ENV) phải đọc qua biến shell: để Actions chèn thẳng env.PUSHED_REPOS vào
          # chuỗi "..." thì shell chạy `tên-nhánh` trong dấu huyền như một lệnh, bình luận ra "nhánh , 187 file" (#53–56).
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "**OMP Orchestrator:** $HEADLINE

          Nhánh đã push (nếu có):
          ${PUSHED_REPOS:-}

          Log và artifact (Allure/Playwright): $RUN_URL

          Để kéo code và session về máy: \`powershell C:\Users\GIGABYTE\.omp\scripts\cancel-cloud-and-pull.ps1\`"

      - name: 8.5 Lưu và đồng bộ phiên làm việc (Session Sync) lên branch omp-sync/sessions
        id: sessions
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.run_number }}
        run: |
          echo "Đang lưu phiên làm việc OMP lên branch omp-sync/sessions..."
          if [ -d "$HOME/.omp/agent/sessions" ] && [ "$(ls -A $HOME/.omp/agent/sessions 2>/dev/null)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            rm -rf /tmp/session_repo
            git clone --branch omp-sync/sessions "https://github.com/${{ github.repository_owner }}/omp-sessions.git" /tmp/session_repo || {
              mkdir -p /tmp/session_repo && cd /tmp/session_repo
              git init && git checkout -b omp-sync/sessions
              git remote add origin "https://github.com/${{ github.repository_owner }}/omp-sessions.git"
            }

            cd /tmp/session_repo
            mkdir -p "issue-$ISSUE_NUMBER"
            cp -r $HOME/.omp/agent/sessions/* "issue-$ISSUE_NUMBER/" 2>/dev/null || true

            # Khử toàn bộ token / secret nhạy cảm trước khi commit để không bị GitHub Secret Scanning chặn push
            if [ -n "$GH_PAT" ]; then
              grep -rl "$GH_PAT" "issue-$ISSUE_NUMBER" 2>/dev/null | xargs sed -i "s/$GH_PAT/***/g" 2>/dev/null || true
            fi
            find "issue-$ISSUE_NUMBER" -type f \( -name "*.json" -o -name "*.jsonl" -o -name "*.txt" -o -name "*.log" \) -exec sed -i -E 's/ghp_[a-zA-Z0-9]{36}/***/g; s/github_pat_[a-zA-Z0-9_]{82}/***/g; s/sk-or-v1-[a-f0-9]{64}/***/g; s/(^|[^A-Za-z0-9_+\/-])sk-[A-Za-z0-9_-]{20,}/\1***/g' {} + 2>/dev/null || true

            git add .
            if ! git diff --cached --quiet; then
              git commit -m "chore(session): update session state for issue #$ISSUE_NUMBER"
              # Nhiều run xong cùng lúc cùng đẩy vào nhánh này: bị từ chối thì kéo bản mới về, ghép lên rồi đẩy lại.
              # Mỗi run chỉ ghi thư mục issue-<số> của mình nên ghép không đụng nhau.
              pushed=false
              for attempt in 1 2 3 4 5 6 7 8; do
                if git push origin HEAD:omp-sync/sessions; then pushed=true; break; fi
                sleep $((attempt * 2 + RANDOM % 6))  # lệch giờ ngẫu nhiên để các run không đụng nhau lần nữa
                git pull --rebase -q origin omp-sync/sessions || { git rebase --abort 2>/dev/null; break; }
              done
              if [ "$pushed" = true ]; then
                echo "Đã lưu session lên branch omp-sync/sessions!"
              else
                echo "::error::Không đẩy được session lên omp-sync/sessions sau 8 lần: session của issue #$ISSUE_NUMBER chưa được lưu."
                exit 1
              fi
            else
              echo "Không có thay đổi trong session, bỏ qua push."
            fi
          fi

      - name: 8.6 Tự chạy tiếp khi agent bị dừng giữa chừng (quá giờ / lỗi), tối đa 3 lượt
        # Chỉ khi bước 6 hỏng (cắt vì quá giờ hoặc lỗi), KHÔNG khi agent tự xong hay người dùng huỷ. Nối tiếp = gắn lại
        # nhãn agent-task trên CHÍNH issue này: run mới đọc lại nguyên đề, làm tiếp trên nhánh và phiên đã lưu, nên
        # không phải chép đề sang issue mới. Repo này CÔNG KHAI: bình luận chỉ ghi số lượt và lý do, không ghi tên repo,
        # nhánh, file hay nội dung việc. Nhãn phải gắn bằng GH_PAT: sự kiện do GITHUB_TOKEN tạo không kích hoạt workflow.
        if: ${{ !cancelled() && github.event_name == 'issues' && steps.agent.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SESSION_SAVED: ${{ steps.sessions.outcome }}
          MAX_ROUNDS: 3
        run: |
          MARK='<!-- omp-auto-continue -->'
          PULL='Kéo về máy: `powershell C:\Users\GIGABYTE\.omp\scripts\cancel-cloud-and-pull.ps1`'
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Thiếu secret GH_PAT: nhãn gắn bằng GITHUB_TOKEN không kích hoạt run mới, không tự chạy tiếp được."
            exit 0
          fi
          # Không đếm được số lượt đã chạy thì KHÔNG chạy tiếp: thà dừng còn hơn nối tiếp không giới hạn.
          done_rounds=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARK\"))] | length" | awk '{s+=$1} END {print s+0}') \
            || done_rounds=$MAX_ROUNDS
          # Lượt này có tiến triển không: đầu nhánh sau bước 7 khác đầu nhánh lúc agent bắt đầu, ở ít nhất một repo.
          # Không tiến triển (khoá Codex hỏng, lỗi lặp lại, agent không làm được gì) thì chạy tiếp chỉ tốn thêm lượt.
          progressed=false
          if [ -f "$RUNNER_TEMP/heads-before.txt" ] && [ -n "${AGENT_BRANCH:-}" ]; then
            while read -r dir before; do
              now=$(git -C "workspace/$dir" rev-parse -q --verify "refs/heads/$AGENT_BRANCH" || echo none)
              if [ "$now" != none ] && [ "$now" != "$before" ]; then progressed=true; fi
            done < "$RUNNER_TEMP/heads-before.txt"
          fi
          stop=""
          if [ "$done_rounds" -ge "$MAX_ROUNDS" ]; then
            stop="đã tự chạy tiếp đủ $MAX_ROUNDS lượt"
          elif printf '%s' "${PUSHED_REPOS:-}" | grep -qE 'gộp tay|bị từ chối|KHÔNG commit được'; then
            stop="có phần việc không vào được nhánh chính của việc (xung đột hoặc không commit được), cần gộp tay"
          elif [ "$progressed" != true ]; then
            stop="lượt này không có commit mới (lỗi lặp lại hoặc agent không làm được gì)"
          elif [ "$SESSION_SAVED" != success ]; then
            stop="chưa lưu được phiên làm việc, chạy tiếp sẽ mất ngữ cảnh"
          fi
          if [ -n "$stop" ]; then
            echo "Không tự chạy tiếp: $stop"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "**OMP Orchestrator:** agent dừng giữa chừng nhưng KHÔNG tự chạy tiếp: $stop. Phần đã làm đã được lưu. $PULL"
            exit 0
          fi
          next=$((done_rounds + 1))
          # Bình luận mang dấu trước, gắn nhãn sau: run mới đếm dấu này để biết mình là lượt thứ mấy.
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MARK
          **OMP Orchestrator:** agent dừng giữa chừng (quá giờ hoặc lỗi), phần đã làm và phiên làm việc đã được lưu. Tự chạy tiếp lượt $next/$MAX_ROUNDS, làm tiếp đúng chỗ đang dở."
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label agent-task >/dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label agent-task
          echo "Đã gắn lại nhãn agent-task: lượt $next/$MAX_ROUNDS sẽ chạy sau khi run này kết thúc."

      - name: 9. Tự động đồng bộ & lưu mới Token Codex OAuth vào GitHub Secrets (Auto-Persist)
        # Không chạy ở run bị huỷ; chỉ ghi khi run này thật sự làm mới token (xem scripts/agent/persist_codex_token.py).
        if: ${{ !cancelled() }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          OMP_CODEX_AUTH: ${{ secrets.OMP_CODEX_AUTH }}
        run: |
          pip install --quiet pynacl requests
          python3 scripts/agent/persist_codex_token.py

  # E2E chạy bằng test-runner.yml (bộ dựng đang xanh) thành một run riêng, job này chờ kết quả. Có test đỏ thì chạy lại
  # đúng các spec đó trên nhánh nền (hoặc main) để tách test vốn đã đỏ; chỉ test đỏ MỚI mới gọi agent sửa tiếp (chung
  # giới hạn 3 lượt với bước 8.6, đếm bằng dấu omp-auto-continue). Repo CÔNG KHAI: bình luận chỉ ghi số lượt, số test
  # đỏ và mã run; tên test và dòng lỗi lượt sau tự đọc từ log run E2E. Logic tách lỗi: scripts/agent/e2e-run.sh (có test).
  e2e:
    needs: run-agent
    if: ${{ !cancelled() && needs.run-agent.outputs.agent_ok == 'true' && needs.run-agent.outputs.need_e2e == 'true' }}
    runs-on: ubuntu-latest
    # Hai lượt test-runner (nhánh việc + nhánh nền), mỗi lượt e2e-run.sh chờ tối đa ~145 phút; 360 là trần của GitHub.
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      SPECS: ${{ needs.run-agent.outputs.specs }}
      WEB_REF: ${{ needs.run-agent.outputs.web_ref }}
      BACKEND_REF: ${{ needs.run-agent.outputs.backend_ref }}
      BASE_WEB_REF: ${{ needs.run-agent.outputs.base_web_ref }}
      BASE_BACKEND_REF: ${{ needs.run-agent.outputs.base_backend_ref }}
      MAX_ROUNDS: 3
    steps:
      - name: 0. Lấy script E2E của orchestrator
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/agent

      - name: 1. Chạy E2E bằng test-runner.yml, test đỏ thì chạy lại trên nhánh nền để tách lỗi có sẵn
        id: run
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Thiếu secret GH_PAT, không gọi được test-runner.yml"; exit 1; fi
          REQ="agent-${{ github.run_id }}-${{ github.run_attempt }}" bash scripts/agent/e2e-run.sh | tee -a "$GITHUB_OUTPUT"

      - name: 2. E2E đỏ thì gọi agent sửa tiếp (tối đa 3 lượt), xanh thì báo
        if: ${{ !cancelled() && github.event_name == 'issues' && steps.run.outputs.conclusion != '' }}
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          BASE_RUN_ID: ${{ steps.run.outputs.base_run_id }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          FAILED: ${{ steps.run.outputs.failed }}
          PREEXISTING: ${{ steps.run.outputs.preexisting }}
          FINGERPRINT: ${{ steps.run.outputs.fingerprint }}
        run: |
          MARK='<!-- omp-auto-continue -->'
          URL="${{ github.server_url }}/$REPO/actions/runs/$RUN_ID"
          BASE_URL="${{ github.server_url }}/$REPO/actions/runs/$BASE_RUN_ID"
          BASE_DESC=main
          if [ -n "$BASE_WEB_REF$BASE_BACKEND_REF" ]; then BASE_DESC="nhánh nền"; fi
          say() { gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$1"; }
          if [ "$CONCLUSION" = no_task_branch ]; then
            # Fail closed: không có nhánh của việc thì E2E chỉ kiểm lại $BASE_DESC, xanh hay đỏ đều không nói gì về việc này.
            say "**OMP Orchestrator:** E2E KHÔNG chạy: Web và Backend đều không có nhánh của việc này (agent không đẩy code Web/Backend), nên không có gì để kiểm. Xem bình luận trước về nhánh đã push."
            exit 1
          fi
          if [ "$CONCLUSION" = success ]; then
            say "**OMP Orchestrator:** E2E xanh ($URL)."
            exit 0
          fi
          if [ "${FAILED:-0}" = 0 ] && [ "${PREEXISTING:-0}" != 0 ]; then
            say "**OMP Orchestrator:** E2E có $PREEXISTING test đỏ nhưng chạy lại trên $BASE_DESC cũng đỏ y như vậy: lỗi có sẵn, không do việc này, không gọi agent sửa. Việc: $URL · $BASE_DESC: $BASE_URL"
            exit 0
          fi
          if [ "${FAILED:-0}" = 0 ]; then
            say "**OMP Orchestrator:** E2E hỏng ($CONCLUSION) nhưng không có test nào đỏ: lỗi dựng môi trường, không gọi agent sửa. $URL"
            exit 1
          fi
          PRE_NOTE=""
          if [ "${PREEXISTING:-0}" != 0 ]; then PRE_NOTE=" Ngoài ra $PREEXISTING test đỏ có sẵn trên $BASE_DESC, không tính ($BASE_URL)."; fi
          markers=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" --paginate --jq "[.[] | select(.body | contains(\"$MARK\")) | .body]" \
            | jq -s 'add // []') || markers='null'
          if [ "$markers" = null ]; then
            say "**OMP Orchestrator:** E2E đỏ ($FAILED test mới, $URL), không đọc được số lượt đã chạy nên KHÔNG tự sửa tiếp.$PRE_NOTE"
            exit 1
          fi
          done_rounds=$(printf '%s' "$markers" | jq 'length')
          last_fp=$(printf '%s' "$markers" | jq -r '[.[] | capture("e2e-fp:(?<f>[0-9a-f]+)")? | .f] | last // ""')
          stop=""
          if [ "$done_rounds" -ge "$MAX_ROUNDS" ]; then
            stop="đã tự chạy tiếp đủ $MAX_ROUNDS lượt"
          elif [ "$FINGERPRINT" = "$last_fp" ]; then
            stop="đúng các test đỏ y như lượt trước, sửa thêm không ăn thua"
          fi
          if [ -n "$stop" ]; then
            say "**OMP Orchestrator:** E2E đỏ ($FAILED test mới, $URL), KHÔNG tự sửa tiếp: $stop.$PRE_NOTE Kéo về máy: \`powershell C:\Users\GIGABYTE\.omp\scripts\cancel-cloud-and-pull.ps1\`"
            exit 1
          fi
          next=$((done_rounds + 1))
          # e2e-base: lượt sửa bỏ các test cũng đỏ trên nhánh nền khỏi danh sách đưa cho agent (bước 6).
          say "$MARK
          <!-- e2e-run:$RUN_ID e2e-base:$BASE_RUN_ID e2e-fp:$FINGERPRINT -->
          **OMP Orchestrator:** E2E đỏ ($FAILED test mới, $URL). Tự chạy tiếp lượt $next/$MAX_ROUNDS để agent sửa.$PRE_NOTE"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent-task >/dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label agent-task
          exit 1