name: Probe omp-sessions (tam thoi)

# Kiem GH_PAT doc/ghi duoc repo private omp-sessions truoc khi bo nhanh public. Xoa sau khi chay.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Doc va ghi thu (dry-run) omp-sessions bang GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global 'credential.https://github.com.helper' '!f() { echo username=x-access-token; echo "password=${GH_PAT}"; }; f'
          git ls-remote "https://github.com/${{ github.repository_owner }}/omp-sessions.git" refs/heads/omp-sync/sessions
          git clone -q --branch omp-sync/sessions --depth 1 "https://github.com/${{ github.repository_owner }}/omp-sessions.git" /tmp/s
          cd /tmp/s && git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q --allow-empty -m probe
          git push --dry-run origin HEAD:omp-sync/sessions
          echo "GH_PAT doc + ghi (dry-run) omp-sessions: OK"
